/* ================= v4.2.1 · Speed test (TEST page only) =================
   One button under Settings → Import and backup that times each kind of request from this phone and shows where the server spent it
   (the "_prof" every answer carries). For Gate 1: real Google numbers for check 3 without reading Apps Script › Executions by hand.
   Shown only on the TEST page (window.HOST_EGYPT_TEST). It reads, opens two children, re-saves 5 attendance rows with the status they
   already have, and only when ticked writes 2 test ratings (same skill and level as the child's latest rating). */
(function () {
  if (!window.HOST_EGYPT_TEST || typeof importExport !== 'function') return;
  const base = importExport;
  importExport = function () {
    return base() + `<h3>${L('Speed test (TEST page only)', 'اختبار السرعة (صفحة الاختبار بس)')}</h3>
    <p class="small muted">${L('Times each kind of request from this phone, 3 loads, 2 children opened, 5 attendance saves (the same status again), and shows where the server spent the time. Nothing changes in the sheet except the save time of those rows, unless you tick the ratings.', 'بيقيس كل نوع طلب من الموبايل ده: 3 تحميلات، فتح طفلين، 5 حفظ حضور (بنفس الحالة)، وبيوضح السيرفر صرف الوقت فين. مفيش حاجة بتتغير في الجدول غير وقت حفظ الصفوف دي، إلا لو علّمت على التقييمات.')}</p>
    <label class="small"><input type="checkbox" id="spdRate"> ${L('Also 2 test ratings (adds 2 rating rows to the TEST sheet)', 'كمان تقييمين تجريبيين (بيضيف صفين تقييم في جدول الاختبار)')}</label><br>
    <label class="small"><input type="checkbox" id="spdBurst"> ${L('Also 30 attendance saves sent at once, like three phones tapping together (check 7; same statuses again)', 'كمان 30 حفظ حضور مع بعض، زي 3 موبايلات بيدوسوا في نفس الوقت (فحص 7؛ نفس الحالات)')}</label>
    <div class="row wrap"><button class="btn ghost" data-act="speed-test">${L('Run the speed test', 'شغّل اختبار السرعة')}</button><button class="btn ghost" data-act="speed-copy">${L('Copy the result', 'انسخ النتيجة')}</button></div>
    <div id="spdBox" class="small"></div>`;
  };
  const LOG = [];
  const top = (st, n) => Object.keys(st || {}).slice(0, n).map(k => k + ' ' + st[k]).join(', ');
  async function one(kind, a, body) {
    const t0 = performance.now(); let j = null, err = '';
    try { j = await api(a, body) } catch (e) { err = e.message || String(e) }
    const ms = Math.round(performance.now() - t0); const p = (j && j._prof) || {};
    const row = { kind, a, ms, server: p.ms, boot: p.boot, bytes: p.bytes, prepared: p.prepared, steps: top(p.steps, 5), err };
    LOG.push(row); show(); return j;
  }
  function show() {
    const box = document.getElementById('spdBox'); if (!box) return;
    const lines = LOG.map(r => `${r.kind.padEnd(16)} ${String(r.ms).padStart(6)} ms phone · ${String(r.server == null ? '?' : r.server).padStart(6)} ms server · boot ${r.boot == null ? '?' : r.boot} · ${r.bytes || 0} B${r.prepared ? ' · prepared' : ''}${r.err ? ' · ⚠ ' + r.err : ''}\n    ${r.steps}`);
    const kinds = {}, srv = {}; LOG.forEach(r => { if (!r.err && r.kind !== 'done' && r.kind !== '30 at once') { (kinds[r.kind] = kinds[r.kind] || []).push(r.ms); (srv[r.kind] = srv[r.kind] || []).push(r.server == null ? 0 : r.server) } });   // judged on the phone's round trip (what a coach waits for); the script's own time beside it
    const target = { load: 4000, 'open child': 6000, attendance: 3000, rating: 3000 };   // '30 at once' is judged by its line: 30 saved, 0 failed
    const sum = Object.keys(kinds).map(k => { const max = Math.max(...kinds[k]), maxS = Math.max(...srv[k]); return `${k}: slowest ${max} ms on the phone (${maxS} ms in the script) · target ${target[k] ? '≤ ' + target[k] + ' ms' : '–'} ${target[k] ? (max <= target[k] ? 'PASS' : 'OVER') : ''}` });
    box.innerHTML = `<pre class="miglog">${esc(lines.join('\n'))}\n\n${esc(sum.join('\n'))}</pre>`;
  }
  async function run() {
    LOG.length = 0; const box = document.getElementById('spdBox'); if (box) box.textContent = L('Running… keep this screen open.', 'شغال… خلّي الشاشة مفتوحة.');
    for (let i = 0; i < 3; i++) await one('load', 'load', {});
    const D0 = S.D || {}; const kids = (D0.players || []).filter(p => (p.status || 'active') === 'active').slice(0, 2);
    for (const p of kids) await one('open child', 'view', { player_id: p.id });
    /* v4.2.2: 5 rows across the latest sessions (one session may have fewer than 5) */
    const sesDate = {}; (D0.sessions || []).forEach(x => sesDate[x.id] = String(x.date || ''));
    const att = (D0.attendance || []).filter(a => a.session_id && a.player_id && a.status).slice().sort((a, b) => (sesDate[b.session_id] || '').localeCompare(sesDate[a.session_id] || '') || String(b.session_id).localeCompare(String(a.session_id)));
    const rows = att.slice(0, 5);
    for (const a of rows) await one('attendance', 'bulk', { kind: 'attendance', recs: [{ session_id: a.session_id, player_id: a.player_id, status: a.status }] });
    if (rows.length < 5) LOG.push({ kind: 'attendance', a: 'bulk', ms: 0, steps: '', err: L(`only ${rows.length} attendance rows to save again`, `فيه ${rows.length} صفوف حضور بس`) });
    const tick = document.getElementById('spdRate');
    if (tick && tick.checked) {
      /* v4.2.2: ratings only on a HOST session (imported sessions keep their old records as written): the same skill and level as an evaluator
         rating already on a HOST session, else skill 1.1 at the child's current level on the latest HOST session */
      const host = (D0.sessions || []).filter(x => x.source !== 'notebook' && x.source !== 'old platform' && x.status !== 'cancelled' && (x.sport || 'basketball') === 'basketball' && String(x.date) <= todayStr()).sort((a, b) => String(b.date).localeCompare(String(a.date)));
      const hostIds = {}; host.forEach(x => hostIds[x.id] = 1);
      let ob = (D0.obs || []).filter(o => hostIds[o.session_id] && o.source === 'evaluator' && o.player_id && o.skill && /^\d+\.\d+$/.test(String(o.skill)) && +o.level >= 1).slice(-2).map(o => ({ session_id: o.session_id, player_id: o.player_id, skill: o.skill, level: +o.level }));
      if (!ob.length && host.length) {
        const ok = (D0.players || []).filter(p => (p.status || 'active') === 'active' && p.consent_dev === 'yes').slice(0, 2);
        ob = ok.map(p => ({ session_id: host[0].id, player_id: p.id, skill: '1.1', level: Math.max(1, Math.min(4, ((D0.states || {})[p.id + '|1.1'] || {}).level || 1)) }));
      }
      for (const o of ob) await one('rating', 'evrecord', { session_id: o.session_id, items: [{ player_id: o.player_id, skill: o.skill, level: o.level }] });
      if (!ob.length) LOG.push({ kind: 'rating', a: 'evrecord', ms: 0, steps: '', err: L('no HOST session to rate on', 'مفيش حصة HOST للتقييم') });
    }
    const burst = document.getElementById('spdBurst');
    if (burst && burst.checked && att.length) {
      /* v4.2.2: 30 saves sent together; each one that finds the server busy is sent again after 0.7–2.5 s, exactly like the phone's queue,
         until saved (at most 90 s). Then the rows are checked: one row per child and session, no duplicate. */
      const list = []; for (let i = 0; i < 30; i++) list.push(att[i % Math.min(att.length, 10)]);
      const t0 = performance.now(); const sleep = ms => new Promise(r => setTimeout(r, ms));
      const res = await Promise.all(list.map(async a => {
        const s0 = performance.now(); let tries = 0, last = '', p = {};
        while (performance.now() - t0 < 90000) {
          tries++;
          try { const j = await api('bulk', { kind: 'attendance', recs: [{ session_id: a.session_id, player_id: a.player_id, status: a.status }] }); p = j._prof || {}; return { ok: true, tries, ms: Math.round(performance.now() - s0), p } }
          catch (e) { last = e.message || String(e); if (!e.net) return { ok: false, tries, ms: Math.round(performance.now() - s0), err: last }; await sleep(700 + Math.round(Math.random() * 1800)) }
        }
        return { ok: false, tries, ms: Math.round(performance.now() - s0), err: last || 'gave up after 90 s' };
      }));
      const ok = res.filter(r => r.ok), bad = res.filter(r => !r.ok); const waits = ok.map(r => parseInt(String((r.p.steps || {})['lock wait'] || '0'), 10) || 0);
      const first = ok.filter(r => r.tries === 1).length; const total = Math.round(performance.now() - t0);
      let dup = '?'; try { const j = await api('load', {}); const n = {}; (j.attendance || []).forEach(x => { const k = x.session_id + '|' + x.player_id; n[k] = (n[k] || 0) + 1 }); dup = list.filter((a, i, all) => all.findIndex(b => b.session_id === a.session_id && b.player_id === a.player_id) === i).filter(a => (n[a.session_id + '|' + a.player_id] || 0) !== 1).length } catch (e) { }
      LOG.push({ kind: '30 at once', a: 'bulk', ms: total, server: Math.max(0, ...ok.map(r => r.p.ms || 0)), steps: `${ok.length} of 30 saved (${first} at the first try, ${ok.length - first} after the server was busy), ${bad.length} not saved · all saved after ${(total / 1000).toFixed(1)} s · slowest single save ${Math.max(0, ...ok.map(r => r.ms))} ms · longest lock wait ${Math.max(0, ...waits)} ms · rows with a duplicate: ${dup}${bad.length ? ' · ' + bad[0].err : ''}`, err: '' });
      show();
    }
    LOG.push({ kind: 'done', a: '', ms: 0, steps: new Date().toISOString() + ' · ' + navigator.userAgent.slice(0, 80), err: '' }); show();
  }
  document.addEventListener('click', ev => {
    const el = ev.target.closest && ev.target.closest('[data-act="speed-test"],[data-act="speed-copy"]'); if (!el) return;
    ev.stopPropagation();
    if (el.dataset.act === 'speed-test') run();
    else { const b = document.getElementById('spdBox'); const txt = b ? b.innerText : ''; try { navigator.clipboard.writeText(txt) } catch (e) { } }
  }, true);
})();

/* ================= v4.3 · Home screens as agreed: one screen of cards, tap a card to open its own page =================
   The agreed rule (HOST design sessions): no long scrolling on any home. Every role's home is a short screen of summary cards; each card
   opens its own page (one tap to anything); "back" (the phone's own back, or ← Home) returns to the home.
   Owner (and co-owners): Week / Month / Quarter on top, the next session, then one tile per area (one number, one line). Each tile opens
   the full card that used to be stacked on one long page (same content, same numbers).
   Coach: the next session with each child by name, the last session, then tiles for what he can do (brief, advice, suggestions,
   ratings waiting, messages…). Nothing is removed: every block is one tap away. */
(function () {
  const pageOf = () => S.hp || null;
  function openPage(key) { S.hp = key; try { history.pushState({ hp: key }, '') } catch (e) { } window.scrollTo(0, 0); rerender() }
  function closePage() { if (!S.hp) return; S.hp = null; rerender(); window.scrollTo(0, 0) }
  window.addEventListener('popstate', () => { if (S.hp) { S.hp = null; rerender() } });
  /* the bottom menu always lands on the role's home itself */
  document.addEventListener('click', ev => { const el = ev.target.closest && ev.target.closest('[data-act="nav"]'); if (el && S.hp) S.hp = null }, true);
  regAction('hp-open', d => openPage(d.v));
  regAction('hp-back', () => { if (history.state && history.state.hp) history.back(); else closePage() });
  /* the hero's "look into" lines open their card's page (they used to scroll down the long page) */
  regAction('ix-go', d => openPage('ix:' + d.v));

  const back = title => `<div class="hp-head"><button class="btn ghost hp-back" data-act="hp-back">${S.lang === 'ar' ? '→' : '←'} ${L('Home', 'الرئيسية')}</button><h1>${esc(title)}</h1></div>`;
  const LEV = { high: 3, medium: 2, low: 1 };
  const worst = recs => (recs || []).reduce((m, r) => Math.max(m, LEV[r.level] || 0), 0);
  const tile = (key, title, value, sub, o) => { o = o || {}; const lv = o.level || 0;
    return `<button class="hp-tile${lv >= 2 ? ' lv' + lv : ''}${o.wide ? ' wide' : ''}" data-act="hp-open" data-v="${esc(key)}"><span class="hp-t">${esc(title)}${lv >= 2 ? ' <span class="hp-dot"></span>' : ''}</span><b class="hp-v${o.open ? ' sm' : ''}">${o.open ? L('Open', 'افتح') + ' ›' : value}</b>${sub ? `<span class="hp-s">${sub}</span>` : ''}</button>` };
  /* a module's card becomes its own tile: its first heading as the title, its first count tag as the number */
  const plain = h => String(h || '').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
  function modTiles(list, prefix) {
    return list.map((html, i) => { if (!String(html).replace(/\s/g, '')) return '';
      const m = /<(h2|h3|b)[^>]*>([\s\S]*?)<\/\1>/.exec(html); let title = plain(m ? m[2] : '').replace(/\s\d+$/, ''); if (!title) title = L('More', 'المزيد'); if (title.length > 38) title = title.slice(0, 36) + '…';
      const tg = /<span class="tag[^"]*">\s*(\d+)\s*<\/span>/.exec(html); const attn = /class="(card|tag)[^"]*\battn\b/.test(html);
      return tile(prefix + i, title, tg ? tg[1] : '', '', tg ? { level: attn ? 2 : 0 } : { open: true, level: attn ? 2 : 0 }); }).join('');
  }
  const kp = (c, key) => (c && c.kpis || []).find(k => k.key === key) || {};
  const kv1 = k => k.value == null ? '–' : ixVal(k.value, k.kind, k.hidden_reason);

  /* ---------------- owner ---------------- */
  const prevOwnerHome = ownerHome;
  ownerHome = function () {
    const it = ixD(); const p = periodState(); const stale = !ixPeriodMatches(it); if (stale && S.ixFailed !== p.kind + '|' + (p.key || '')) setTimeout(() => ixFetch(true), 0);
    const hp = pageOf(); if (hp) return ownerPage(hp, it, stale);
    const nx = upcoming(3).filter(x => !x.closed); const n0 = nx[0]; const act = activeP(); const todo = homeTodo(); const brief = D().brief || [];
    const banners = `${D().content_ok === false && !D().migrate_needed ? `<div class="card attn"><b>${L('Load the content file once.', 'حمّل ملف المحتوى مرة واحدة.')}</b><button class="btn small" data-act="nav" data-v="settings">${L('Open Settings', 'افتح الإعدادات')}</button></div>` : ''}${D().migrate_needed && S.me.role === 'owner' ? `<div class="card attn"><b>${L('The academy sheet needs its one-time update.', 'جدول الأكاديمية محتاج تحديثه لمرة واحدة.')}</b><button class="btn small" data-act="nav" data-v="settings">${L('Open Settings', 'افتح الإعدادات')}</button></div>` : ''}`;
    const next = n0 ? `<div class="card hp-next"><div class="row sp"><div class="grow"><span class="tag info">${w('next')}</span><div><b>${esc(fmtDL(n0.date))}</b></div><div class="small muted">${fmtT(n0.start)} – ${fmtT(n0.end)} · ${esc(placeName())} · ${L(`${act.length} expected`, `${act.length} متوقع`)}</div></div><button class="btn" data-act="open-session" data-date="${n0.date}" data-start="${n0.start}">${n0.rec ? w('open') : L('Open', 'افتح')}</button></div></div>` : `<div class="card attn"><b>${L('No session in the schedule.', 'لا توجد حصص في الجدول.')}</b></div>`;
    let tiles = '';
    if (it) {
      const c = it.cards; const h = it.hero;
      const lookTop = (h.look || [])[0];
      tiles += tile('ix:look', L('Look into', 'بص على'), String((h.look || []).length), lookTop ? esc(String(LL(lookTop)).slice(0, 70)) + (String(LL(lookTop)).length > 70 ? '…' : '') : L('Nothing this period', 'مافيش حاجة الفترة دي'), { level: (h.counts || {}).high ? 3 : (h.counts || {}).medium ? 2 : 0, wide: true });
      tiles += tile('ix:growth', L('Children', 'الأطفال'), kv1(kp(c.growth, 'active')), L(`joined ${kv1(kp(c.growth, 'joiners'))} · left ${kv1(kp(c.growth, 'leavers'))}`, `انضم ${kv1(kp(c.growth, 'joiners'))} · ساب ${kv1(kp(c.growth, 'leavers'))}`), { level: worst(c.growth.recs) });
      tiles += tile('ix:families', L('Families', 'العيلات'), `${c.families.silent_families != null ? c.families.silent_families : kv1(kp(c.families, 'silent'))}`, L('quiet for 14 days', 'ساكتين 14 يوم'), { level: worst(c.families.recs) });
      tiles += tile('ix:sessions', L('Sessions', 'الحصص'), kv1(kp(c.sessions, 'held')), L(`attendance ${kv1(kp(c.sessions, 'attendance'))}`, `الحضور ${kv1(kp(c.sessions, 'attendance'))}`), { level: worst(c.sessions.recs) });
      tiles += tile('ix:dev', L('Development', 'التطور'), kv1(kp(c.dev, 'ups')), L(`level changes up · ${kv1(kp(c.dev, 'obs'))} ratings`, `مستويات طلعت · ${kv1(kp(c.dev, 'obs'))} تقييم`), { level: worst(c.dev.recs) });
      tiles += tile('ix:rel', L('Relationships', 'العلاقات'), kv1(kp(c.rel, 'reds')), L('children with red signals', 'أطفال عندهم إشارات حمرا'), { level: worst(c.rel.recs) });
      tiles += tile('ix:money', L('Money', 'الفلوس'), kv1(kp(c.money, 'collected')), L(`due ${kv1(kp(c.money, 'due'))} · overdue ${kv1(kp(c.money, 'overdue'))}`, `مستحق ${kv1(kp(c.money, 'due'))} · متأخر ${kv1(kp(c.money, 'overdue'))}`), { level: worst(c.money.recs) });
      tiles += tile('ix:coaches', L('Coaches', 'المدربين'), String((it.coaches || []).length), L('facts per coach', 'وقائع لكل مدرب'));
      const so = (it.setup && it.setup.items || []).filter(x => !x.dismissed).length;
      tiles += tile('ix:setup', L('Setup advice', 'نصايح الترتيب'), String(so), L('groups, ratios, staff', 'المجموعات والنسب والمدربين'), { level: so ? 2 : 0 });
    }
    tiles += tile('brief', L('This week', 'الأسبوع ده'), String(brief.length), L('worth a conversation', 'يستاهل كلام'), { level: brief.some(b => b.priority === 'high') ? 3 : 0 });
    tiles += tile('todo', L('To do', 'المطلوب'), String(todo.length), L('today and this month', 'النهارده والشهر ده'), { level: todo.length ? 2 : 0 });
    tiles += modTiles(MOD.home.map(fn => { try { return fn() } catch (e) { return '' } }), 'mod:');
    return `<div class="row sp hp-top"><h1>${L('Academy insights', 'رؤى الأكاديمية')}</h1><span class="tiny muted">${fmtDL(todayStr())}</span></div>${banners}
      ${periodBar()}${stale ? `<p class="tiny muted ix-loading">${S.ixLoading ? L('Preparing the insights for this period…', 'جارٍ تجهيز الرؤى للفترة دي…') : L('Showing the last computed period.', 'بيعرض آخر فترة محسوبة.')}</p>` : it && it.prepared_at ? `<p class="tiny muted ix-prep">${L('Prepared at', 'اتجهزت الساعة')} ${esc(String(it.prepared_at).slice(11, 16))} UTC · <button class="link" data-act="ix-refresh">${L('Refresh now', 'حدّث دلوقتي')}</button></p>` : ''}
      ${next}${it ? `<p class="hp-sum">${esc(LL(it.hero.summary))}</p>` : `<div class="card">${empty(L('Insights appear after the first session with attendance.', 'الرؤى بتظهر بعد أول حصة بحضور.'))}</div>`}
      <div class="hp-grid">${tiles}</div>`;
  };
  function ownerPage(hp, it, stale) {
    const NAMES = { look: ['Look into', 'بص على'], growth: ['Children', 'الأطفال'], families: ['Families', 'العيلات'], sessions: ['Sessions', 'الحصص'], dev: ['Development', 'التطور'], rel: ['Relationships', 'العلاقات'], money: ['Money', 'الفلوس'], coaches: ['Coaches', 'المدربين'], setup: ['Setup advice', 'نصايح الترتيب'], hero: ['Look into', 'بص على'] };
    if (hp.indexOf('ix:') === 0) {
      const k = hp.slice(3); const nm = NAMES[k] || [k, k];
      if (!it) return back(L(nm[0], nm[1])) + `<div class="card">${empty()}</div>`;
      const c = it.cards; const body = k === 'look' || k === 'hero' ? ixHero(it) : k === 'growth' ? ixGrowthCard(c.growth) : k === 'families' ? ixFamiliesCard(c.families) : k === 'sessions' ? ixSessionsCard(c.sessions) : k === 'dev' ? ixDevCard(c.dev) : k === 'rel' ? ixRelCard(c.rel) : k === 'money' ? ixMoneyCard(c.money) : k === 'coaches' ? ixCoachesCards(it.coaches) : k === 'setup' ? ixSetupCard(it.setup) : '';
      return back(L(nm[0], nm[1])) + periodBar() + body;
    }
    if (hp === 'brief') { const brief = D().brief || [];
      return back(L('This week', 'الأسبوع ده')) + `<div class="card">${brief.length ? `<div class="list">${brief.map(b => `<div class="item" style="cursor:default"><span class="dot" style="background:${b.priority === 'high' ? 'var(--flame)' : b.priority === 'medium' ? 'var(--warn)' : 'var(--muted)'}"></span><div class="grow">${esc(LL(b))}</div>${b.priority ? ixLvlTag(b.priority) : ''}${b.domain ? ixDomTag(b.domain) : ''}</div>`).join('')}</div>` : empty(L('Nothing stands out this week.', 'مافيش حاجة لافتة الأسبوع ده.'))}</div>` }
    if (hp === 'todo') { const todo = homeTodo();
      return back(L('To do', 'المطلوب')) + `<div class="card">${todo.length ? `<div class="list">${todo.map(t => `<div class="item" style="cursor:default"><span class="dot" style="background:${t.color || 'var(--flame)'}"></span><div class="grow"><div class="nm">${t.title}</div>${t.sub ? `<div class="sub">${t.sub}</div>` : ''}</div>${t.btn || ''}</div>`).join('')}</div>` : empty(L('Nothing waiting.', 'لا شيء ينتظر.'))}</div>${funnelCard(monthKey(todayStr()))}` }
    if (hp.indexOf('mod:') === 0) { const html = (() => { try { return MOD.home[+hp.slice(4)]() } catch (e) { return '' } })(); const m = /<(h2|h3|b)[^>]*>([\s\S]*?)<\/\1>/.exec(html || ''); return back(plain(m ? m[2] : '') || L('More', 'المزيد')) + (html || `<div class="card">${empty()}</div>`) }
    S.hp = null; return prevOwnerHome();
  }

  /* the last session in three lines: who came / who missed, what was worked on, who stood out; tap opens that session */
  function lastCompact(s) {
    const last = sessionsDone().filter(x => x.date < (s ? s.date : addDays(todayStr(), 1)) && (!s || !s.group_id || !x.group_id || x.group_id === s.group_id) && hereCount(x.id))[0]; if (!last) return '';
    const roster = sessionRoster(last); const missed = roster.filter(p => { const a = attRec(last.id, p.id); return a && a.status === 'absent' });
    const outs = (D().notes || []).filter(n => n.session_id === last.id && n.by_role !== 'parent'); const who = [...new Set(outs.map(n => (P(n.player_id) || {}).name).filter(Boolean))].map(n => String(n).split(' ')[0]);
    const cats = catsOf(last).map(c => esc(catName(c))).join(' · ');
    return `<div class="card hp-last" data-act="session" data-id="${last.id}"><div class="row sp"><h2>${L('Last session', 'الحصة اللي فاتت')}</h2><span class="tiny muted">${fmtD(last.date)}${last.coach ? ' · <bdi>' + esc(last.coach) + '</bdi>' : ''} ›</span></div>
      <div class="hp-line"><b>${hereCount(last.id)} / ${roster.length}</b> ${L('came', 'حضروا')}${missed.length ? ` · ${L('missed', 'غاب')}: ${missed.map(p => esc(String(p.name).split(' ')[0])).join('، ')}` : ''}</div>
      ${cats ? `<div class="hp-line">${L('Worked on', 'اشتغلنا على')}: ${cats}</div>` : ''}
      <div class="hp-line">${who.length ? L('Stood out', 'اتميّزوا') + ': ' + who.map(esc).join('، ') : `<span class="muted">${L('No standout note written.', 'مفيش ملاحظة مميزة اتكتبت.')}</span>`}</div></div>`;
  }
  /* ---------------- coach ---------------- */
  coachToday = function () {
    const hp = pageOf();
    const nx = upcoming(1).filter(x => !x.closed)[0]; const t = todayStr();
    const nxs = nx ? (nx.rec || { id: '', date: nx.date, start: nx.start, end: nx.end, group_id: mainGroup(), kind: 'normal' }) : null;
    const roster = nxs ? sessionRoster(nxs) : []; const expected = roster.filter(p => !holdOn(p.id, nxs.date) || holdOn(p.id, nxs.date).kind === 'health');
    const flagOf = p => { if (!nxs) return null; const c = ctxOn(p.id, nxs.date) || ctxOn(p.id, addDays(nxs.date, -1)) || (t < nxs.date ? ctxOn(p.id, t) : null); return c && (c.pain === 'yes' || c.sleep === 'poor' || c.exam === 'yes' || c.mood === 'low' || c.forward === 'reluctant') ? c : null };
    const waiting = (D().recs || []).filter(r => r.status === 'proposed');
    const myTaps = sid => (D().obs || []).some(o => o.session_id === sid && o.source === 'coach');
    const toTap = sessionsDone().filter(s => s.date >= addDays(t, -7) && hereCount(s.id) && s.source !== 'notebook' && s.source !== 'old platform' && !myTaps(s.id));
    const brief = nxs ? briefLines(nxs) : [];
    const advice = adviceCard(); const hand = handoffCard(nxs); const surv = surveyCard() + reflectionCard();
    const modList = MOD.coachToday.map(fn => { try { return fn() } catch (e) { console.error(e); return '' } });
    if (hp === 'brief') return back(L('Before you start', 'قبل ما تبدأ')) + (brief.length ? `<div class="card"><ul class="small brief">${brief.join('')}</ul><p class="tiny muted">${L('Check-ins, the last note on each child (any coach), who is close to a level change, concerns, medical short note, home activity.', 'تحديثات العائلة، آخر ملاحظة على كل طفل (أي مدرب)، مين قريب من تغيير مستوى، القلق، الملاحظة الطبية المختصرة، النشاط البيتي.')}</p></div>` : `<div class="card">${empty(L('Nothing special about any child before this session.', 'مافيش حاجة خاصة عن أي طفل قبل الحصة دي.'))}</div>`);
    if (hp === 'advice') return back(L('For each child', 'لكل طفل')) + (advice || `<div class="card">${empty()}</div>`);
    if (hp === 'waiting') return back(L('Suggestions', 'المقترحات')) + `<div class="card"><b>${L(`${waiting.length} suggestion(s) waiting for you`, `${waiting.length} مقترح بانتظار قرارك`)}</b><p class="small muted">${L('Each suggestion comes from what the evaluators saw. You decide: use it, change it, or not now.', 'كل مقترح مبني على ما لاحظه المقيّمان. أنت تقرر: نعتمده أو نعدّله أو ليس الآن.')}</p><div class="list">${waiting.map(r => `<div class="item" data-act="player" data-id="${r.player_id}"><div class="grow"><div class="nm">${esc((P(r.player_id) || {}).name || '')}</div><div class="sub">${esc(skillName(r.skill))}</div></div></div>`).join('')}</div>${nx ? `<button class="btn" data-act="open-session" data-date="${nx.date}" data-start="${nx.start}" data-tab="plan">${w('open')}</button>` : ''}</div>`;
    if (hp === 'rate') return back(L('Your rating is waiting', 'تقييمك بانتظارك')) + `<div class="card"><div class="list">${toTap.map(s => `<div class="item" data-act="session" data-id="${s.id}" data-tab="taps"><div class="grow">${fmtDL(s.date)}</div><span class="tag attn">${L('2 minutes', 'دقيقتان')}</span></div>`).join('')}</div></div>`;
    if (hp === 'handoff') return back(L('From the previous coach', 'من المدرب اللي قبلك')) + hand;
    if (hp === 'survey') return back(L('Your feedback', 'رأيك')) + surv;
    if (hp && hp.indexOf('cmod:') === 0) { const html = modList[+hp.slice(5)] || ''; const m = /<(h2|h3|b)[^>]*>([\s\S]*?)<\/\1>/.exec(html); return back(plain(m ? m[2] : '') || L('More', 'المزيد')) + (html || `<div class="card">${empty()}</div>`) }
    if (hp === 'more') return back(L('Notebook', 'الدفتر')) + `<div class="card"><b>${L('A session from your notebook?', 'حصة من دفترك؟')}</b><p class="small muted">${L('Add it with its real date, then enter who came and your ratings as written.', 'أضفها بتاريخها الحقيقي، ثم أدخل الحضور وتقييماتك كما كتبتها.')}</p><button class="btn ghost" data-act="past-new">+ ${L('Add a past session', 'إضافة حصة سابقة')}</button></div>`;
    if (hp) S.hp = null;
    /* the home: the session with each child by name, the last session, then what he can do */
    const kids = expected.slice().sort((a, b) => String(a.name).localeCompare(String(b.name), 'ar')).map(p => { const f = flagOf(p); return `<button class="hp-kid${f ? ' flag' : ''}" data-act="player" data-id="${p.id}">${esc(String(p.name).split(' ')[0])}${f ? ' ⚑' : ''}</button>` }).join('');
    const hero = nx ? `<div class="hero"><span class="tag info">${w('next')}</span><h2>${fmtDL(nx.date)}</h2><p class="muted">${fmtT(nx.start)} – ${fmtT(nx.end)} · ${esc(placeName())}${nxs.coach_lead ? ' · ' + esc(userName(nxs.coach_lead)) : ''}</p>
      <p class="small"><b>${L('Focus', 'التركيز')}:</b> ${catsOf(nxs).map(c => esc(catName(c))).join(' · ') || '–'}</p>
      <div class="hp-kids">${kids || `<span class="small muted">${L('No children on this session yet.', 'مفيش أطفال على الحصة دي لسه.')}</span>`}</div>
      <button class="btn" data-act="open-session" data-date="${nx.date}" data-start="${nx.start}">${L('Open: plan, who came, your rating', 'افتح: الخطة والحضور وتقييمك')}</button></div>` : `<div class="card">${empty(L('No session in the schedule.', 'لا توجد حصص في الجدول.'))}</div>`;
    let tiles = '';
    tiles += tile('brief', L('Before you start', 'قبل ما تبدأ'), String(brief.length), L('children with something to know', 'أطفال فيه حاجة تتعرف عنهم'), { level: brief.length ? 2 : 0 });
    if (toTap.length) tiles += tile('rate', L('Your rating', 'تقييمك'), String(toTap.length), L('session(s) waiting · 2 min', 'حصة مستنية · دقيقتين'), { level: 3 });
    if (waiting.length) tiles += tile('waiting', L('Suggestions', 'المقترحات'), String(waiting.length), L('waiting for your decision', 'مستنية قرارك'), { level: 2 });
    if (advice) tiles += tile('advice', L('For each child', 'لكل طفل'), '›', L('what to work on, what to watch', 'يشتغل على إيه وتراقب إيه'), { open: true });
    if (hand) tiles += tile('handoff', L('From the previous coach', 'من المدرب اللي قبلك'), '›', L('his note for you', 'ملاحظته ليك'), { level: 2, open: true });
    if (surv.replace(/\s/g, '')) tiles += tile('survey', L('Your feedback', 'رأيك'), '›', L('a short question for you', 'سؤال قصير ليك'), { level: 2, open: true });
    tiles += modTiles(modList, 'cmod:');
    tiles += tile('more', L('Notebook', 'الدفتر'), '', L('add a past session', 'إضافة حصة سابقة'), { open: true });
    return `<h1 class="hp-hello">${L('Hello', 'مرحبًا')}${S.me.name ? ' ' + esc(S.me.name) : ''}</h1>${hero}${lastCompact(nxs)}<div class="hp-grid">${tiles}</div>`;
  };
})();

</script>
</body>
</html>
