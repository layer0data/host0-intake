<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>HOST Egypt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@600;700&family=Tajawal:wght@400;500;700;800&display=swap">
<style>
/* HOST Egypt: one page app. Top bar, a side menu on wide screens and a bottom menu on phones, cards in the middle. HOST blue from the logo; orange only for things that need attention. */
:root{
  --bg:#F3F5F8;--surface:#FFFFFF;--sunk:#E9EEF4;--ink:#14202C;--muted:#56636F;--line:#D3DBE4;
  --accent:#2F6FAE;--accent-ink:#FFFFFF;--accent-soft:#DFEAF5;--flame:#C4541A;--flame-soft:#FBE7DA;--ok:#1F7A4D;--ok-soft:#DDF1E6;--warn:#9A6B06;--warn-soft:#FBF0D6;
  --display:"IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif;--body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--arabic:"IBM Plex Sans Arabic","Geeza Pro",Tahoma,sans-serif;
  color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0F151C;--surface:#18212B;--sunk:#111922;--ink:#E6EDF4;--muted:#9AA8B6;--line:#2A3643;--accent:#7DB2E4;--accent-ink:#0F151C;--accent-soft:#1A2F44;--flame:#F08A52;--flame-soft:#3A2416;--ok:#62C894;--ok-soft:#173226;--warn:#E8B44A;--warn-soft:#3A2E12;color-scheme:dark}}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);-webkit-text-size-adjust:100%}
body.rtl{font-family:var(--arabic)}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15;text-wrap:balance}
body.rtl h1,body.rtl h2,body.rtl h3{font-family:var(--arabic)}
h1{font-size:26px}h2{font-size:20px}h3{font-size:16px}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 8px) 14px 8px;display:flex;align-items:center;gap:10px}
.top img{height:28px;width:auto}
.top .ttl{font:700 15px var(--display);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
body.rtl .top .ttl{font-family:var(--arabic)}
@media(max-width:430px){.top .ttl{visibility:hidden}}
.lang{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.lang button{border:0;background:var(--surface);padding:5px 9px;font-size:13px;font-weight:600;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.who{font-size:12px;color:var(--muted);white-space:nowrap}
.layout{display:grid;grid-template-columns:1fr;max-width:1200px;margin:0 auto}
@media (min-width:900px){.layout{grid-template-columns:210px 1fr}}
nav.side{display:none}
@media (min-width:900px){nav.side{display:flex;flex-direction:column;gap:4px;padding:16px 10px;position:sticky;top:52px;align-self:start}}
nav.side button,nav.bottom button{border:0;background:none;cursor:pointer;color:var(--muted);font-weight:600}
nav.side button{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;text-align:start}
nav.side button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(env(safe-area-inset-bottom,0px) + 6px)}
@media (min-width:900px){nav.bottom{display:none}}
nav.bottom button{display:grid;justify-items:center;gap:2px;font-size:11px;padding:4px 6px;min-width:56px}
nav.bottom button[aria-current="page"]{color:var(--accent)}
.ic{width:20px;height:20px;display:inline-block}
main{padding:16px 14px 100px;display:grid;gap:14px;min-width:0}
@media (min-width:900px){main{padding:20px 20px 40px}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:10px;min-width:0}
.card.attn{border-color:var(--flame);box-shadow:0 0 0 2px var(--flame-soft)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.sp{justify-content:space-between}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:2px}
.kpi b{font:700 26px var(--display);font-variant-numeric:tabular-nums}
.kpi span{font-size:12.5px;color:var(--muted);font-weight:600}
.kpi.attn b{color:var(--flame)}
.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--accent);color:var(--accent-ink);font-weight:600;cursor:pointer;min-height:42px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{min-height:34px;padding:6px 10px;font-size:13px}
.btn.wa{background:#1F7A4D;color:#fff}
.btn.warn{background:var(--flame);color:#fff}
.btn[disabled]{opacity:.55;cursor:default}
.link{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;font-weight:600;text-decoration:underline}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.tag{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;background:var(--sunk);color:var(--muted);white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:var(--ok)}.tag.attn{background:var(--flame-soft);color:var(--flame)}.tag.info{background:var(--accent-soft);color:var(--accent)}.tag.warn{background:var(--warn-soft);color:var(--warn)}
.list{display:grid;gap:0}
.item{display:flex;gap:10px;align-items:center;padding:11px 2px;border-top:1px solid var(--line);cursor:pointer;min-width:0}
.item:first-child{border-top:0}
.item .nm{font-weight:600}
.item .sub{font-size:12.5px;color:var(--muted)}
.av{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;flex:0 0 auto}
label.f{display:grid;gap:5px;font-size:13px;font-weight:600;min-width:0}
label.row:has(> input[type=checkbox]){flex-wrap:nowrap;align-items:flex-start;gap:8px;text-align:start}label.row > input[type=checkbox]{flex:0 0 auto;margin-top:3px}
input.in,select.in,textarea.in{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:9px 10px;width:100%;min-width:0}
textarea.in{min-height:80px;resize:vertical}
input.in:focus,select.in:focus,textarea.in:focus{outline:2px solid var(--accent);outline-offset:1px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-weight:600;font-size:13.5px;white-space:nowrap;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:8px 9px;text-align:start;border-top:1px solid var(--line);vertical-align:middle;white-space:nowrap}
th{background:var(--sunk);font-size:12px;color:var(--muted);border-top:0;position:sticky;top:0}
td.n,th.n{text-align:end;font-variant-numeric:tabular-nums}
.bars{display:grid;gap:6px}
.bar{display:grid;grid-template-columns:minmax(90px,150px) 1fr 44px;gap:8px;align-items:center;font-size:13px}
.bar .tr{height:10px;background:var(--sunk);border-radius:6px;overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--accent);border-radius:6px}
.bar .tr i.alt{background:var(--flame)}
.bar .v{text-align:end;font-variant-numeric:tabular-nums;font-weight:600}
.cols{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(180px,1fr);gap:10px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--sunk);border-radius:12px;padding:10px;display:grid;gap:8px;align-content:start;min-height:120px}
.col h3{font-size:13px;display:flex;justify-content:space-between}
.lead{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:3px;cursor:pointer;font-size:13.5px}
.lead.due{border-color:var(--flame)}
.score{display:flex;gap:4px}
.score button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer}
.score button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.score button.clr{width:auto;padding:0 8px;font-weight:600;font-size:12px;color:var(--muted)}
select.sc{width:54px;padding:5px;border:1px solid var(--line);border-radius:7px;background:var(--surface);text-align:center;font-weight:700}
select.sc.set{background:var(--accent-soft);border-color:var(--accent)}
.pl{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.pl:first-child{border-top:0;padding-top:0}
.skr{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.att{display:flex;gap:4px}
.att button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-weight:600;font-size:13px;cursor:pointer}
.att button[aria-pressed="true"].y{background:var(--ok);color:#fff;border-color:var(--ok)}
.att button[aria-pressed="true"].n{background:var(--flame);color:#fff;border-color:var(--flame)}
.att button[aria-pressed="true"].l{background:var(--warn);color:#fff;border-color:var(--warn)}
.att button[aria-pressed="true"].e{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.row.wrap{flex-wrap:wrap}
/* levels: four steps of one blue, never red (L1 is a starting point, not a failure) */
:root{--l1:#E3EDF7;--l1i:#24496E;--l2:#BCD3EC;--l2i:#1C3E60;--l3:#6C9FD3;--l3i:#FFFFFF;--l4:#2F6FAE;--l4i:#FFFFFF}
@media (prefers-color-scheme:dark){:root{--l1:#1C2B3A;--l1i:#BFD6EE;--l2:#284766;--l2i:#DCEAF7;--l3:#3E6D9E;--l3i:#FFFFFF;--l4:#6FA5DC;--l4i:#0F151C}}
.lv{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:700;white-space:nowrap}
.lv i{font-style:normal;letter-spacing:1px;font-size:10px}
.lv0{background:var(--sunk);color:var(--muted)}.lv1{background:var(--l1);color:var(--l1i)}.lv2{background:var(--l2);color:var(--l2i)}.lv3{background:var(--l3);color:var(--l3i)}.lv4{background:var(--l4);color:var(--l4i)}
.lv.soft{background:transparent;box-shadow:inset 0 0 0 1.5px currentColor;color:var(--accent)}
.lvn{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;flex:0 0 auto}
.dev{display:grid;gap:4px;border-top:1px solid var(--line);padding-top:10px}
.dev:first-of-type{border-top:0}
.dev h3{font-size:15px}
details.dev summary{cursor:pointer;list-style:revert}
.drow{display:flex;gap:10px;align-items:center;padding:7px 0;border-top:1px dashed var(--line);min-width:0}
.drow:first-of-type{border-top:0}
.drow .sub{font-size:12.5px;color:var(--muted)}
.tright{text-align:end;display:grid;justify-items:end;gap:2px}
.plan{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:8px;background:var(--bg)}
ol.blocks{margin:0;padding-inline-start:20px;display:grid;gap:8px}
ol.blocks li{padding-inline-start:4px}
.choice{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.choice button{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 11px;font-weight:600;font-size:13px;cursor:pointer;min-height:40px}
.choice button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pl.deep{background:linear-gradient(var(--accent-soft),var(--accent-soft)) left top/4px 100% no-repeat;padding-inline-start:10px}
body.rtl .pl.deep{background-position:right top}
.evrow{display:grid;gap:6px;padding:6px 0;border-top:1px dashed var(--line)}
.evbtns{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
@media (max-width:600px){.evbtns{grid-template-columns:repeat(2,minmax(0,1fr))}.evbtns .no{grid-column:1/-1}}
.evbtns button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px;font-size:12.5px;font-weight:600;cursor:pointer;display:grid;gap:3px;text-align:start;min-height:44px;align-content:start}
.evbtns button span{font-weight:400;font-size:11.5px;color:var(--muted);line-height:1.35}
.evbtns button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.compact .evbtns{grid-template-columns:repeat(5,minmax(0,1fr))}.compact .evbtns .no{grid-column:auto}.compact .evbtns{gap:4px}.compact .evbtns button{padding:6px 1px;font-size:11px;text-align:center;justify-items:center;word-break:keep-all;overflow-wrap:normal;letter-spacing:-.2px}@media (max-width:420px){.compact .evbtns button{font-size:9.5px}}
.compact .evbtns button b{font-size:15px}
details.pl>summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:4px 0}details.pl>summary::-webkit-details-marker{display:none}details.pl>summary::before{content:'▸';color:var(--muted)}details.pl[open]>summary::before{content:'▾'}
.evbtns button[aria-pressed="true"] span{color:var(--accent-ink);opacity:.9}
.evbtns button.no{color:var(--muted)}
.evbtns button.no[aria-pressed="true"]{color:var(--accent-ink)}
.kpi.txt b{font:600 15px/1.35 var(--body)}body.rtl .kpi.txt b{font-family:var(--arabic)}
table.board td{text-align:center;font-weight:700;padding:6px 4px;min-width:28px}
table.board td:first-child{text-align:start}
table.board td.c0{color:var(--muted)}table.board td.c1{background:var(--l1);color:var(--l1i)}table.board td.c2{background:var(--l2);color:var(--l2i)}table.board td.c3{background:var(--l3);color:var(--l3i)}table.board td.c4{background:var(--l4);color:var(--l4i)}
table.board td.soft{opacity:.6}
.kid{max-width:560px;margin:0 auto;padding:16px;display:grid;gap:14px}
.kid h1{font-size:34px}
.big{font-size:20px;font-weight:600}
.faces{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 12px}
.faces label{cursor:pointer}.faces input{position:absolute;opacity:0}
.faces span{display:inline-grid;place-items:center;min-width:64px;min-height:56px;padding:6px 12px;border:2px solid var(--line);border-radius:14px;font-size:22px;font-weight:700;background:var(--surface)}
.faces input:checked+span{border-color:var(--accent);background:var(--accent-soft)}
.faces input:focus-visible+span{outline:2px solid var(--accent)}
.report{display:grid;gap:8px}
.report h3{margin-top:6px}
ul{margin:0;padding-inline-start:20px}
@media print{body{background:#fff}.modal{position:static;background:none}.sheet{max-height:none;box-shadow:none}body:has(#modal .modal) #app{display:none}}
.notice{border-radius:10px;padding:10px 12px;background:var(--accent-soft);font-size:14px}
.notice.attn{background:var(--flame-soft)}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,16,24,.45);display:grid;place-items:end center}
@media (min-width:700px){.modal{place-items:center}}
.sheet{background:var(--surface);width:min(640px,100%);max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 18px);display:grid;gap:12px}
@media (min-width:700px){.sheet{border-radius:16px}}
#toast{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 74px);z-index:60;max-width:520px;margin:0 auto;background:var(--ink);color:var(--surface);border-radius:12px;padding:11px 14px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.login{max-width:420px;margin:8vh auto;padding:0 16px;display:grid;gap:14px}
.login img{height:60px;justify-self:start}
.pre{white-space:pre-wrap;background:var(--sunk);border-radius:10px;padding:12px;font-size:14px}
.saving{font-size:12px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--flame)}
@media print{.top,nav,.noprint{display:none!important}main{padding:0}.card{border:0}}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ===== the bars that keep everyone honest about saving ===== */
.obbar{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 62px);z-index:45;box-shadow:0 -4px 14px rgba(0,0,0,.18);display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:9px 14px;font-size:14px;font-weight:600}
.obbar.warn{background:#B42318;color:#fff}@media (min-width:900px){.obbar{bottom:0}}body.has-ob main{padding-bottom:150px}.obbar.off{background:#FEF3C7;color:#7A4B00}
.chart{display:block;max-width:100%;margin:6px 0}.chart .cl{font-size:10px;fill:var(--muted)}.chart .cv{font-size:10px;fill:var(--ink);font-weight:700}.chart .cn{font-size:9px;fill:var(--muted);font-weight:400}.chart .cb{fill:var(--accent)}.chart .cb-none{fill:var(--line)}.chart .cb-prev{fill:var(--line)}.chart .cg{stroke:var(--line);stroke-width:1}.chart .cline{fill:none;stroke:var(--accent);stroke-width:2}.chart .cline-1{stroke:#94a3b8;stroke-dasharray:4 3}.chart .cdot{fill:var(--accent)}.chart .cdot-1{fill:#94a3b8}.chart.spark{height:34px;width:120px;margin:0}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted)}.legend .sw{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--accent);margin-inline-end:4px}.legend .sw-1{background:#94a3b8}
.conf{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--sunk);color:var(--muted);margin-inline-start:6px}.conf-strong{background:var(--ok-soft);color:var(--ok)}.conf-moderate{background:var(--accent-soft);color:var(--accent)}.conf-emerging{background:var(--flame-soft);color:var(--flame)}
.delta{display:block;font-size:12px;color:var(--muted)}.delta.up{color:var(--ok)}.delta.down{color:var(--warn)}.kpi.tap{cursor:pointer}.kpi.tap:hover{box-shadow:0 0 0 2px var(--accent-soft)}
.period{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0}.tabs.sm button{padding:6px 10px;font-size:13px}
.tbl{width:100%;border-collapse:collapse}.tbl th,.tbl td{text-align:start;padding:6px 8px;border-bottom:1px solid var(--line)}.tbl th{color:var(--muted);font-weight:600}
body.is-test::before{content:"TEST PAGE · TEST SHEET";position:fixed;top:0;left:50%;transform:translateX(-50%);z-index:99;background:#7C3AED;color:#fff;font:700 11px/1 system-ui;padding:4px 10px;border-radius:0 0 8px 8px;letter-spacing:.06em;pointer-events:none}
.miglog{white-space:pre-wrap;font-size:12px;background:var(--soft,#f1f4f9);border-radius:8px;padding:8px;max-height:260px;overflow:auto}
.obheld{display:flex;gap:8px;align-items:center;flex-wrap:wrap;width:100%}.obheld span{flex:1;min-width:160px;font-size:12px;opacity:.9}.obbar b{font-weight:800}.obbar span{flex:1;min-width:180px;font-weight:500}
.obbar button{border:0;border-radius:8px;padding:6px 12px;font-weight:700;background:#fff;color:#B42318;cursor:pointer}

.regform .regsec{border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
.regsec legend{font-weight:700;padding:0 6px;display:flex;align-items:center;gap:8px}
.regsec legend .num{display:inline-flex;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);align-items:center;justify-content:center;font-size:.8em}

.card.muted{opacity:.92}

/* p7_coach.css */
/* v4 batch 3 · coaches, sessions, evaluators */
.hero{background:linear-gradient(135deg,var(--accent),var(--ink));color:#fff;border-radius:16px;padding:16px 18px;margin-bottom:12px}

.drills{display:grid;gap:8px}.drillsk{border:1px solid var(--line);border-radius:12px;padding:8px 12px}.drillsk summary{cursor:pointer}

.tag.lvl-low{background:var(--sunk);color:var(--muted)}
.tag.dom{background:var(--accent-soft);color:var(--accent);font-weight:600}
.ix-rec{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:8px;background:var(--sunk);margin-top:4px}
.ix-rec.lvl-high{border-color:var(--flame)}
.ix-rec.lvl-medium{border-color:var(--warn,#c98a00)}
.ix-rec .ix-label{font-weight:700}
.ix-step{display:grid;gap:2px;font-size:13.5px}
.ix-step b{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.ix-actions{margin:0;padding-inline-start:20px;display:grid;gap:6px;font-size:13.5px}
.ix-actions li{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
.ix-actions li .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.ix-actions .row{gap:6px}
.ix-matrix{display:grid;grid-template-columns:minmax(120px,1.4fr) 1fr 1fr;gap:4px;font-size:13px;align-items:stretch}
.ix-matrix .hd{font-size:12px;color:var(--muted);font-weight:600;padding:6px 4px}
.ix-matrix .cell{font:700 22px var(--display);text-align:center;padding:8px;border-radius:8px;background:var(--sunk)}
.ix-matrix .cell.ok{background:var(--ok-soft);color:var(--ok)}
.ix-matrix .cell.attn{background:var(--flame-soft);color:var(--flame)}
tr.ix-mm td{background:var(--flame-soft)}
.leg{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--line);vertical-align:middle;cursor:help}
.leg-green{background:var(--ok)}
.leg-yellow{background:var(--warn,#e0a800)}
.leg-red{background:var(--flame)}
.leg-grey{background:var(--line)}
.ix-legs td,.ix-legs th{padding:5px 6px;text-align:start}
.ix-setup{grid-column:1/-1}
.ix-advice .sub{font-size:12.5px;color:var(--muted)}
.ix-coach h3{font-size:16px;margin:0}
.ix-coaches .kpi b{font-size:20px}
.ix-flash{animation:ixflash 1.6s ease-out}
@keyframes ixflash{0%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
.ix-loading{margin:-4px 0 0}
.ix-card table.tbl{width:100%;border-collapse:collapse}
.ix-card table.tbl th,.ix-card table.tbl td{padding:5px 6px;border-top:1px solid var(--line);text-align:start;vertical-align:top}
.ix-card .chart .cl{font-size:9.5px}
.ix-card .spark{vertical-align:middle;display:inline-block}
/* Arabic: keep bar labels anchored at the bar's start so long labels are not hidden under the bars */
.rtl .ix-card .chart text.cl,.rtl .ix-card .chart text.cv{direction:ltr;unicode-bidi:isolate}
/* the older home blocks fold under one "More" below the six insight cards */
details.ix-more > summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
details.ix-more > summary::-webkit-details-marker { display: none; }
details.ix-more > summary::before { content: '▸'; color: var(--muted); }
details.ix-more[open] > summary::before { content: '▾'; }
details.ix-more > .card { background: var(--sunk); }

/* p7_zhome.css */
/* v4.3 · homes on one screen: tiles that open their own page */
.hp-top h1{margin:0}
.hp-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:4px}
@media (min-width:760px){.hp-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.hp-tile{appearance:none;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:2px;align-content:start;min-height:96px;cursor:pointer;font:inherit;color:inherit;min-width:0}
.hp-tile.wide{grid-column:1/-1;min-height:0}
.hp-tile:active{transform:scale(.98)}
.hp-tile:hover{box-shadow:0 0 0 2px var(--accent-soft)}
.hp-t{font-size:13px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:6px}
.hp-v{font:800 28px/1.1 var(--display);font-variant-numeric:tabular-nums}
.hp-s{font-size:12.5px;color:var(--muted);line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.hp-tile.lv2{border-color:var(--warn);background:linear-gradient(0deg,var(--warn-soft),var(--surface) 70%)}
.hp-tile.lv3{border-color:var(--flame);background:linear-gradient(0deg,var(--flame-soft),var(--surface) 70%)}
.hp-dot{width:8px;height:8px;border-radius:50%;background:var(--warn);display:inline-block}
.hp-tile.lv3 .hp-dot{background:var(--flame)}
.hp-sum{font-size:14px;line-height:1.5;margin:2px 2px 6px;color:var(--ink)}
.hp-next{padding:12px 14px}
.hp-head{display:flex;align-items:center;gap:10px;margin:2px 0 8px}
.hp-head h1{margin:0;font-size:22px}
.hp-back{padding:8px 12px}
.hp-hello{margin-bottom:6px}
.hp-kids{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 6px}
.hp-kid{appearance:none;border:1px solid rgba(148,163,184,.45);background:rgba(255,255,255,.12);color:inherit;border-radius:999px;padding:7px 12px;font:600 14px var(--body);cursor:pointer}
.hp-kid.flag{border-color:var(--flame);background:var(--flame-soft);color:var(--ink)}
/* the period switch: full width and easy to tap on a phone */
.period{display:grid;grid-template-columns:1fr;gap:8px}
.period .tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;overflow:visible}
.period .tabs button{padding:10px 6px;font-size:15px;text-align:center}
.hp-sum{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.hp-tile{min-height:84px}
.hp-v.sm{font-size:16px;font-weight:700;color:var(--accent)}
.hp-last{padding:12px 14px;cursor:pointer}
.hp-last .hp-line{font-size:14px;line-height:1.5}

function obPut(e) {

/* line / sparkline: series [{label, points:[{x,label,y,n}]}] */
function chartLine(series, o) {
  o = o || {}; const W = o.w || 320, H = o.h || 120, pad = { l: 34, r: 8, t: 8, b: 22 }; const kind = o.kind || 'count';
  const xs = series[0] ? series[0].points.map(p => p.label) : []; const all = series.flatMap(s => s.points.map(p => p.y).filter(v => v != null)); const max = Math.max(kind === 'rate' ? 1 : 0.0001, ...all), min = 0;
  const X = i => pad.l + (xs.length > 1 ? i * (W - pad.l - pad.r) / (xs.length - 1) : (W - pad.l - pad.r) / 2); const Y = v => H - pad.b - ((v - min) / (max - min || 1)) * (H - pad.t - pad.b);

function periodState() { if (!S.period) S.period = { kind: store.get('period') || 'month', key: '' }; return S.period }
function periodLabel(p) { const t = todayStr(); if (p.kind === 'week') { const k = p.key || weekStart(t); return L('Week of ', 'أسبوع ') + fmtDS(k) } if (p.kind === 'quarter') { const k = p.key || quarterKey(t); return k.replace('-Q', L(' · Q', ' · ربع ')) } return fmtMonth(p.key || t.slice(0, 7)) }
function weekStart(d) { const t = parseD(d); const day = (t.getDay() + 1) % 7; t.setDate(t.getDate() - day); return ymd(t) }
function quarterKey(d) { const m = +d.slice(5, 7); return d.slice(0, 4) + '-Q' + (Math.floor((m - 1) / 3) + 1) }

function funnelCard(mk) {

  const rows = [[L('Enquiries', 'استفسارات'), L0.length], [L('Free session booked', 'حجز حصة مجانية'), reached('booked')], [L('Came', 'حضر'), reached('tried')], [L('Registered', 'سجّل'), reached('registered')]];
  const max = Math.max(1, rows[0][1]);

/* ================= SESSIONS ================= */
const groups = () => D().groups || [];
const mainGroup = () => (groups()[0] || {}).id || '';
const planOf = sid => (D().evalplans || []).find(e => e.session_id === sid) || null;
/* a session's focus is one or two categories: the coach teaches and rates them; the evaluators rate the sub-skills inside them that are open for each child */
const catsOf = s => { const p = planOf(s.id); return (p && Array.isArray(p.cats) && p.cats.length) ? p.cats.map(String) : (s.kind === 'competition' ? ['1', '10'] : ((D().plan || {}).cats || [])) };
const isScrim = s => s.kind === 'competition' || (planOf(s.id) || {}).scrim === 'yes';
const catsTxt = s => catsOf(s).map(c => esc(catName(c))).join(' · ') || '–';
/* the sub-skills an evaluator rates for one child in one session: open along the chain, in the session's categories; game skills only in a scrimmage */
const subsFor = (pid, s) => { const op = openOf(pid); const sc = isScrim(s); const base = catsOf(s).reduce((a, c) => a.concat(subsOf(c).filter(k => op.indexOf(k.id) >= 0 && (k.ctx !== 'scrimmage' || sc))), []); return base.concat(checksFor(pid).filter(k => !base.some(b => b.id === k.id) && (k.ctx !== 'scrimmage' || sc))) };
/* v4.2: the two skills this child is checked on every session (the focus and its comparison, in an order that does not tell which is which) */
const checksFor = pid => ((D().checks || {})[pid] || []).map(id => skillById(id)).filter(Boolean);
const SKIND = [['normal', 'Normal session', 'حصة عادية'], ['skills_day', 'Skills day (every 3 months)', 'يوم المهارات (كل 3 أشهر)'], ['competition', 'Competition / scrimmage', 'منافسة / مباراة تدريبية'], ['low_load', 'Low-load session', 'حصة بحمل منخفض'], ['baseline', 'First evaluation', 'التقييم الأول']];

/* the third way: quick questions for the Phase 1 skills of today's areas (the v2 Light mode) */
function questionsBox(s, chosen) {
  const focus = catsOf(s).map(c => subsOf(c).filter(k => k.core).map(k => k.id)).reduce((a, b) => a.concat(b), []).slice(0, 2);
  const mine = (D().obs || []).filter(o => o.source === 'coach' && o.question);

  const pickQ = (pid, sk) => { const qs = Q.filter(q => q.skill === sk); const lv = (st(pid, sk) || {}).level || 0; return (lv >= 3 ? qs.filter(q => /-[BC]$/.test(q.id)) : qs.filter(q => /-A$/.test(q.id)))[0] || qs[0] };
  const ans = (pid, qid) => { const o = mine.filter(x => x.session_id === s.id && x.player_id === pid && x.question === qid).pop(); return o ? o.answer : '' };
  const A = PR().answers || [];

}

/* ================= MONEY (owner, co-owners, admin). Never visible to coaches, evaluators or children =================
   v4: two-tap expenses, recurring suggestions, uniforms as income, the fee flow (reminder → second note → call), paid-until per family,
   repeat-late pattern (owner only) and a monthly P&L with a 6-month sparkline. */
const EXP2 = [['coach_salary', 'Coach salary (monthly)', 'مرتب الكابتن (شهري)', 'monthly'], ['court_rent', 'Court rent (monthly)', 'إيجار الملعب (شهري)', 'monthly'], ['club_helpers', 'Club helpers', 'مساعدين النادي', ''], ['uniforms', 'Uniforms', 'الزي', ''], ['other', 'Other', 'أخرى', '']];
const expLabel = c => { const o = EXP2.find(x => x[0] === c); return o ? L(o[1], o[2]) : lab(EXP, c) };
const feeRows = () => (D().payments || []).filter(x => x.kind !== 'uniform');
const uniRows = () => (D().payments || []).filter(x => x.kind === 'uniform');
const famKey = p => famOf(p);   // v4.1: same family rule everywhere (p7_biz.js)
/* the latest month with a paid fee, per child and per family (the earliest of its children) */
function paidUntil(pid) { const m = feeRows().filter(x => x.player_id === pid && x.status === 'paid').map(x => x.month).sort(); return m.length ? m[m.length - 1] : (P(pid) || {}).paid_until || '' }
function paidUntilFamily(p) { const kids = activeP().filter(q => famKey(q) === famKey(p)); const ms = kids.map(q => paidUntil(q.id)).filter(Boolean).sort(); return kids.length && ms.length === kids.length ? ms[0] : (ms[0] || '') }
/* days since a due fee's month started (payment is due within the month) */
function feeAge(x) { const t = todayStr(); const start = x.month + '-01'; return start < t ? daysBetween(start, t) : 0 }
function lastReminder(x) { const r = Array.isArray(x.reminders) ? x.reminders.slice().sort() : []; return r.length ? r[r.length - 1] : '' }
function feeStage(x) {
  const r = Array.isArray(x.reminders) ? x.reminders.slice().sort() : []; const t = todayStr();
  if (x.flag_call === 'yes') return 'call';
  if (r.length && daysBetween(r[0], t) >= 14) return 'call';
  if (r.length && daysBetween(r[r.length - 1], t) >= 7) return 'second';
  if (r.length) return 'reminded';
  return 'open';
}
/* families late 2+ of the last 4 months: paid after the month ended + 7 days, or still due */
function lateFamilies() {
  const t = todayStr(); const months = []; for (let i = 1; i <= 4; i++) { const d = parseD(t); d.setDate(1); d.setMonth(d.getMonth() - i); months.push(ymd(d).slice(0, 7)) }
  const by = {};
  activeP().forEach(p => { const k = famKey(p); const o = by[k] = by[k] || { p, late: [], names: [] }; if (o.names.indexOf(p.name) < 0) o.names.push(p.name);
    months.forEach(m => { const x = feeRows().find(r => r.player_id === p.id && r.month === m); if (!x || x.status === 'waived' || !(+x.amount)) return; const end = ymd(new Date(+m.slice(0, 4), +m.slice(5, 7), 0)); const late = x.status === 'due' || (x.paid_at && daysBetween(end, String(x.paid_at).slice(0, 10)) > 7); if (late && o.late.indexOf(m) < 0) o.late.push(m) }) });
  return Object.values(by).filter(o => o.late.length >= 2).sort((a, b) => b.late.length - a.late.length);
}
function lastExpense(cat) { return (D().expenses || []).filter(x => x.category === cat).sort((a, b) => String(b.date).localeCompare(String(a.date)))[0] || null }
/* monthly P&L for the last n months: fees + uniforms − expenses (incl. marketing spend) */
function plMonths(n) {
  const out = []; const pay = D().payments || []; const camp = D().campaigns || [];
  let d = parseD(monthKey(todayStr()) + '-01');
  for (let i = 0; i < n; i++) {
    const m = ymd(d).slice(0, 7);
    const fees = pay.filter(x => x.kind !== 'uniform' && x.status === 'paid' && (monthKey(String(x.paid_at || '')) === m || (!x.paid_at && x.month === m))).reduce((a, x) => a + (+x.amount || 0), 0);
    const uni = pay.filter(x => x.kind === 'uniform' && x.status === 'paid' && monthKey(String(x.paid_at || x.month)) === m).reduce((a, x) => a + (+x.amount || 0), 0);
    const due = pay.filter(x => x.kind !== 'uniform' && x.status === 'due' && x.month === m).reduce((a, x) => a + (+x.amount || 0), 0);
    const exp = (D().expenses || []).filter(x => monthKey(x.date) === m).reduce((a, x) => a + (+x.amount || 0), 0) + camp.filter(c => c.month === m).reduce((a, c) => a + (+c.spend || 0), 0);
    out.unshift({ m, fees, uni, due, exp, net: fees + uni - exp });
    d.setMonth(d.getMonth() - 1);
  }
  return out;
}

function avgMonthsStayed() {
  const ps = players().filter(p => p.join_date); if (!ps.length) return 6;
  const m = ps.map(p => { const a = parseD(p.join_date), b = parseD(p.left_date || todayStr()); return Math.max(1, (b - a) / (30.4 * 864e5)) });
  return Math.max(1, Math.round(m.reduce((x, y) => x + y, 0) / m.length));
}

/* ---------- retention ---------- */
function retentionTab() {
  const t = todayStr(); const months = []; for (let i = 5; i >= 0; i--) { const d = parseD(t); d.setDate(1); d.setMonth(d.getMonth() - i); months.push(ymd(d).slice(0, 7)) }
  const activeIn = mk => players().filter(p => p.join_date && monthKey(p.join_date) <= mk && (!p.left_date || monthKey(p.left_date) > mk) && !(p.status === 'left' && !p.left_date && mk >= monthKey(t))).length;
  const attIn = mk => { const ses = sessionsDone().filter(s => monthKey(s.date) === mk); const rows = ses.reduce((a, s) => a.concat(attOf(s.id).filter(x => x.status !== 'excused')), []); return rows.length ? rows.filter(isHere).length / rows.length : null };
  const mx = Math.max(1, ...months.map(activeIn));
  const risk = activeP().map(p => { const l = lastSessionsFor(p.id, 6).filter(x => x.a.status !== 'excused'); const here = l.filter(x => isHere(x.a)).length; const r = []; if (missedRecent(p.id)) r.push(L('missed the last 2', 'غاب آخر حصتين')); else if (l.length >= 4 && here / l.length < .5) r.push(L(`came to ${here} of last ${l.length}`, `حضر ${here} من آخر ${l.length}`)); return r.length ? { p, r } : null }).filter(Boolean);
  const refs = {}; players().forEach(p => { if (p.referred_by) refs[p.referred_by] = (refs[p.referred_by] || 0) + 1 }); leads().forEach(l => { if (l.referred_by && l.stage !== 'registered') refs[l.referred_by] = (refs[l.referred_by] || 0) + 0 });
  const back = players().filter(p => p.status === 'left' || p.status === 'paused').map(p => ({ name: p.name, phone: p.parent_phone, pid: p.id })).concat(leads().filter(l => l.stage === 'past' || l.stage === 'lost').map(l => ({ name: l.child_name, phone: l.phone, lid: l.id, past: true })));
  return `<div class="card"><h2>${L('Active players by month', 'اللاعبون النشطون شهريًا')}</h2><div class="bars">${months.map(m => { const a = activeIn(m), at = attIn(m); return `<div class="bar"><span>${fmtMonth(m)}</span><span class="tr"><i style="width:${Math.round(a / mx * 100)}%"></i></span><span class="v">${a}</span></div><div class="bar tiny muted"><span>${L('attendance', 'الحضور')}</span><span class="tr"><i class="alt" style="width:${Math.round((at || 0) * 100)}%"></i></span><span class="v">${pctTxt(at)}</span></div>` }).join('')}</div></div>
  <div class="card ${risk.length ? 'attn' : ''}"><h2>${L('Families to call', 'عائلات للتواصل')}</h2><div class="list">${risk.map(x => `<div class="item" style="cursor:default"><span class="av">${esc(initials(x.p.name))}</span><div class="grow"><div class="nm">${esc(x.p.name)}</div><div class="sub">${x.r.join(' · ')}</div></div><button class="btn small wa" data-act="compose" data-tpl="missed" data-pid="${x.p.id}">WhatsApp</button></div>`).join('') || `<p class="empty">${L('Nobody at risk right now.', 'لا أحد معرّض للانقطاع الآن.')}</p>`}</div></div>
  <div class="card"><h2>${L('Families who bring others', 'عائلات تجلب غيرها')}</h2><div class="list">${Object.keys(refs).filter(k => refs[k]).sort((a, b) => refs[b] - refs[a]).map(k => `<div class="item" style="cursor:default"><div class="grow">${esc((P(k) || {}).name || k)}</div><span class="tag ok">${refs[k]}</span><button class="btn small ghost" data-act="compose" data-tpl="thanks_referral" data-pid="${k}">${L('Thank', 'اشكر')}</button></div>`).join('') || `<p class="empty">${L('Record “Referred by” on players and leads to see your ambassadors.', 'سجّل «رشّحه» للاعبين والعملاء لترى سفراءك.')}</p>`}</div>
   <button class="btn ghost small" data-act="compose" data-tpl="referral_ask">${L('Ask happy families to bring a friend', 'اطلب من العائلات السعيدة إحضار صديق')}</button></div>
  <div class="card"><h2>${L('Win back', 'استعادة العائلات')}</h2><p class="small muted">${L('Families who left, paused, or registered in the past but are not playing now.', 'عائلات غادرت أو توقفت أو سجّلت سابقًا ولا تلعب الآن.')}</p><div class="list">${back.map(x => `<div class="item" style="cursor:default"><div class="grow"><div class="nm">${esc(x.name)}</div><div class="sub">${x.past ? L('past registration', 'تسجيل سابق') : L('left or paused', 'غادر أو توقف')}</div></div>${x.phone ? `<button class="btn small wa" data-act="compose" data-tpl="winback" ${x.pid ? `data-pid="${x.pid}"` : `data-lead="${x.lid}"`}>WhatsApp</button>` : ''}</div>`).join('') || `<p class="empty">${w('none')}</p>`}</div></div>`;
}

/* ================= MESSAGE CENTRE (N15) =================

    const extra = {}; ['en', 'ar'].forEach(lg => inLang(lg, () => { extra['off_day_' + lg] = relDay(x.date); extra['off_reason_' + lg] = x.closed.reason ? L(' – ', '، ') + x.closed.reason : ''; extra['next_after_off_' + lg] = after ? fmtDL(after.date) + L(' at ', ' الساعة ') + fmtT(after.start) : L('announced soon', 'هيتعلن قريب') }));
    const nf = famGroups(ps).length;
    push({ key: 'cancelled|' + x.date, tpl: 'cancelled', title: L('No session ', 'مفيش تمرين ') + fmtD(x.date) + (x.closed.reason ? ' · ' + esc(x.closed.reason) : ''), why: L(`${nf} famil${nf === 1 ? 'y' : 'ies'}${gid ? ' of ' + groupName(gid) : ''} need to know`, `${nf} عائلة${gid ? ' من ' + groupName(gid) : ''} لازم تعرف`), pids: ps.map(p => p.id), extra, color: 'var(--flame)' }) });
  // 2. absent two weeks (last attended > 14 days ago and missed since) → missed, one per family
  const gone = act.filter(p => { const d = lastAttendedDate(p.id); return (d && daysBetween(d, t) >= 14 && missedSince(p.id, d) >= 2) || (!d && missedRecent(p.id)) }).filter(p => !sentFor('missed', p.id, 7));
  famGroups(gone).forEach(fam => push({ key: 'missed|' + famOf(fam[0]), tpl: 'missed', title: L('We missed you: ', 'وحشتونا: ') + esc(fam.map(p => p.name.split(' ')[0]).join(' · ')), why: L('absent for two weeks', 'غايبين أسبوعين'), pids: [fam[0].id], color: 'var(--warn)' }));
  // 3. birthdays today / this week

  // 4. payments: general reminder from the 25th; private reminders one per family (never a group)

/* ================= GROWTH → Facebook tracker ================= */
function fbTab() {
  const ps = (D().posts || []).filter(p => (p.channel || 'facebook') === 'facebook').slice().sort((a, b) => String(a.date).localeCompare(String(b.date)));
  const enqOf = p => leads().filter(l => l.campaign === p.id); const regOf = p => enqOf(p).filter(l => l.stage === 'registered');
  const spendM = m => (D().campaigns || []).filter(c => c.month === m && c.channel === 'facebook').reduce((a, c) => a + (+c.spend || 0), 0);
  const postsM = m => ps.filter(p => monthKey(p.date) === m && p.status === 'posted').length;
  const tot = ps.reduce((a, p) => ({ reach: a.reach + (+p.reach || 0), enq: a.enq + enqOf(p).length, reg: a.reg + regOf(p).length, posted: a.posted + (p.status === 'posted' ? 1 : 0) }), { reach: 0, enq: 0, reg: 0, posted: 0 });
  const weeks = [...new Set(ps.map(p => p.week || weekStart(p.date)))].sort();
  return `<div class="card"><div class="row sp"><h2>${L('Facebook: plan → published → reach → enquiries → registrations', 'فيسبوك: الخطة ← النشر ← الوصول ← الاستفسارات ← التسجيلات')}</h2><div class="row"><button class="btn ghost small" data-act="seed-posts">${L('Load the 30-post plan', 'حمّل خطة الـ30 منشور')}</button><button class="btn small" data-act="post-new">+ ${L('Post', 'منشور')}</button></div></div>
   <div class="kpis">${kpiTile(L('Published', 'نُشر'), tot.posted + ' / ' + ps.length)}${kpiTile(L('Reach (typed in)', 'الوصول (مدخل يدويًا)'), num(tot.reach), { n: tot.posted })}${kpiTile(L('Enquiries tagged', 'استفسارات مربوطة'), num(tot.enq))}${kpiTile(L('Registrations', 'تسجيلات'), num(tot.reg))}</div>
   <p class="tiny muted">${L('Reach, likes and comments are typed in from Page insights. An enquiry is tagged to a post when its “Campaign” is the post (the link ?post=ID#register does it automatically). Cost per family = that month’s Facebook spend ÷ its posts ÷ registrations.', 'الوصول واللايكات والكومنتات بتتكتب من إحصائيات الصفحة. الاستفسار بيتربط بالمنشور لما تبقى «الحملة» هي المنشور (اللينك ?post=ID#register بيعملها لوحده). تكلفة العائلة = إنفاق فيسبوك في الشهر ÷ منشوراته ÷ التسجيلات.')}</p>
   ${weeks.map(wk => `<h3 style="margin-top:10px">${L('Week of ', 'أسبوع ') + fmtDS(wk)}</h3><div class="tbl"><table class="fbt"><thead><tr><th>${L('Post', 'المنشور')}</th><th>${L('Status', 'الحالة')}</th><th class="n">${L('Reach', 'وصول')}</th><th class="n">${L('Likes', 'لايك')}</th><th class="n">${L('Comments', 'كومنت')}</th><th class="n">${L('Enquiries', 'استفسارات')}</th><th class="n">${L('Registered', 'سجّلوا')}</th><th class="n">${L('Cost / family', 'تكلفة العائلة')}</th></tr></thead><tbody>
   ${ps.filter(p => (p.week || weekStart(p.date)) === wk).map(p => { const e = enqOf(p).length, r = regOf(p).length; const sp = spendM(monthKey(p.date)); const pm = postsM(monthKey(p.date)); const cost = sp && pm && r ? Math.round(sp / pm / r) : null; const tg = p.target || {}; return `<tr><td><div class="nm" data-act="post" data-id="${p.id}" style="cursor:pointer"><b>${esc(p.id)}</b> ${esc(p.title || lab(POSTK, p.kind))}</div><div class="tiny muted">${esc(lab(PGOAL, p.goal) || '')}${tg.reach ? ' · ' + L('target ', 'الهدف ') + num(tg.reach) + ' / ' + num(tg.enquiries || 0) : ''}${p.consent_need && p.consent_need !== 'none' ? ` · <span class="tag warn">${L('consent: ', 'موافقة: ') + esc(p.consent_need)}</span>` : ''}${p.link ? ` · <a href="${esc(p.link)}" target="_blank" rel="noopener">${L('link', 'اللينك')}</a>` : ''}</div></td>
     <td><select class="in sm" data-chg="post-field" data-id="${p.id}" data-k="status">${opt(POSTS, p.status || 'idea')}</select>${p.status === 'posted' && !p.link ? `<input class="in sm" placeholder="${L('paste link', 'حط اللينك')}" data-chg="post-field" data-id="${p.id}" data-k="link">` : ''}</td>
     ${['reach', 'likes', 'comments'].map(k => `<td class="n"><input class="in sm num" type="number" min="0" data-chg="post-field" data-id="${p.id}" data-k="${k}" value="${esc(p[k] == null ? '' : p[k])}" ${p.status === 'posted' ? '' : 'disabled'}></td>`).join('')}
     <td class="n"><b>${e}</b></td><td class="n"><b>${r}</b></td><td class="n">${cost != null ? num(cost) + ' ' + cur() : sp ? '–' : `<span class="muted tiny">${L('no spend', 'بلا إنفاق')}</span>`}</td></tr>` }).join('')}</tbody></table></div>`).join('') || empty(L('No Facebook posts yet. Load the 30-post plan or add one.', 'مفيش منشورات لسه. حمّل الخطة أو ضيف منشور.'))}</div>`;
}

   <div class="list">${list.map(p => `<div class="item" data-act="prospect" data-id="${p.id}"><span class="av prio-${esc(p.priority || 'C')}">${esc(p.priority || 'C')}</span><div class="grow"><div class="nm">${esc(p.name)}${p.name_ar && isAr() ? ' · ' + esc(p.name_ar) : ''}</div><div class="sub">${esc([p.country, p.city].filter(Boolean).join(' · '))} · ${esc((p.sports || []).join(', '))}${p.owner ? ' · ' + esc(p.owner) : ''}${p.next_action ? ` · <span style="color:${p.next_date && p.next_date <= t ? 'var(--flame)' : 'inherit'}">↻ ${esc(p.next_action)}${p.next_date ? ' ' + fmtD(p.next_date) : ''}</span>` : ''}</div></div><span class="tag ${p.stage === 'signed' ? 'ok' : p.stage === 'lost' ? '' : 'info'}">${esc(lab(PSTAGE, p.stage || 'research'))}</span></div>`).join('') || empty(all.length ? L('No prospect matches these filters.', 'مفيش عميل مطابق للفلاتر.') : L('Load the researched list to start.', 'حمّل القائمة المدروسة للبداية.'))}</div>

/* ================= v4 batch 3 · coaches, sessions, evaluators (client) =================
   Coach Today brief, handoff and reflection, approach/outcome tags, the plan engine view (age bands, group size, staffing, stations),
   drills with their source, standard practices, calibration (N7), coach team per session, coach profiles, coach messages, coach survey,
   health hold. Nothing here holds a criterion or a rule; the server decides and this file shows. */
const APPR = [['demonstration', 'Showed it', 'عرضتها عملي'], ['verbal', 'Explained it', 'شرحتها بالكلام'], ['game', 'Through a game', 'من خلال لعبة'], ['peer', 'With a buddy', 'مع زميل']];
const OUTC7 = [['landed', 'It landed', 'نفعت'], ['partly', 'Partly', 'نص نص'], ['didnt', 'Not yet', 'لسه']];
const QUAL = [['federation', 'Federation coaching level', 'مستوى تدريب من الاتحاد'], ['pe_degree', 'PE degree', 'شهادة تربية بدنية'], ['former_player', 'Former player', 'لاعب سابق'], ['first_aid', 'First aid', 'إسعافات أولية'], ['play_based', 'Play-based coaching course', 'كورس تدريب باللعب'], ['safeguarding', 'Safeguarding course', 'كورس حماية الأطفال']];
const NOTEK = { dipped: ['dipped last time', 'نزل المرة اللي فاتت'], behind: ['behind the group here', 'ورا المجموعة هنا'], stretch: ['ready to stretch', 'جاهز لخطوة أكبر'] };
const SURVEY_Q = [['s1', 'The session plan was useful', 'خطة الحصة كانت مفيدة'], ['s2', 'I had what I needed on the court (balls, cones, space)', 'كان عندي اللي محتاجه في الملعب (كور، أقماع، مساحة)'], ['s3', 'Group sizes were right for the children', 'حجم المجموعات كان مناسب للأطفال'], ['s4', 'The age mix in my groups worked', 'خلطة الأعمار في مجموعاتي كانت ماشية'], ['s5', 'I had enough help (assistant / co-lead)', 'كان عندي مساعدة كفاية (مساعد / قائد مشارك)'], ['s6', 'The evaluators and I see the children the same way', 'أنا والمقيّمين بنشوف الأطفال بنفس الطريقة'], ['s7', 'I got useful feedback on my coaching this month', 'جالي رأي مفيد في تدريبي الشهر ده'], ['s8', 'The children were engaged', 'الأطفال كانوا مندمجين'], ['s9', 'The children felt safe and respected', 'الأطفال حسّوا بأمان واحترام'], ['s10', 'Families communicated with me respectfully', 'العائلات اتعاملت معايا باحترام'], ['s11', 'The check-ins before sessions helped me', 'التحديثات قبل الحصة ساعدتني'], ['s12', 'The app saved me time', 'التطبيق وفّر عليّ وقت'], ['s13', 'I understood what to focus on each session', 'كنت فاهم أركّز على إيه كل حصة'], ['s14', 'My sessions started and ended on time', 'حصصي بدأت وخلّصت في وقتها'], ['s15', 'Venue: the court surface and lighting were good', 'المكان: أرضية الملعب والإضاءة كانوا كويسين'], ['s16', 'Venue: water, shade and toilets were available', 'المكان: مياه وظل وحمامات كانوا متاحين'], ['s17', 'I felt supported by the academy owners', 'حسّيت بدعم من أصحاب الأكاديمية'], ['s18', 'My workload this month was manageable', 'حمل الشغل الشهر ده كان معقول']];
const nEv = () => +D().evaluators_needed || +SET().evaluators_needed || 2;
const pe7 = sid => (D().planEngine || {})[sid] || null;
const healthHoldOn = (pid, date) => (D().holds || []).some(h => h.player_id === pid && h.kind === 'health' && h.from <= date && date <= (h.to || h.from));
const teamUsers = () => (D().team || D().users || []).filter(u => u.role === 'coach');
const userName = id => { const u = (D().team || D().users || []).find(x => x.id === id); return u ? u.name : (id || '') };
const apprName = v => lab(APPR, v), outcName = v => lab(OUTC7, v);
async function ensurePlan7(sid) { if (pe7(sid)) return pe7(sid); try { const j = await api('plan7', { session_id: sid }); S.D.planEngine = S.D.planEngine || {}; S.D.planEngine[sid] = j.plan; return j.plan } catch (e) { return null } }

/* ---------- drills for a sub-skill (phase 1); owners also see the URL */
/* drill cards travel on demand (ACTIONS_.drills), once per session of the app, not inside every load */
const drillsOf = sk => ((S.drills || {}).drills || []).filter(d => d.skill === sk);
const practicesOf = sk => ((S.drills || {}).practices || []).filter(d => d.skill === sk);
function ensureDrills(quiet) { if (S.drills || S.drillsLoading || !S.me || S.me.role === 'parent') return; S.drillsLoading = true; api('drills', {}).then(j => { S.drills = { drills: j.drills || [], practices: j.practices || [] }; if (!quiet) rerender() }).catch(() => { }).finally(() => { S.drillsLoading = false }) }
function drillCard(d) {
  const src = d.source || {}; const tag = `<span class="tag ${d.kind === 'HOST DESIGN' ? 'info' : ''}">${d.kind === 'HOST DESIGN' ? L('HOST DESIGN', 'تصميم HOST') : L('STANDARD', 'معياري')}</span>`;
  const line = (lbl, o) => o && (o.en || o.ar) ? `<div class="small"><b>${lbl}:</b> ${esc(LL(o))}</div>` : '';
  return `<div class="drill"><div class="row sp"><b>${esc(LL(d.name))}</b><span>${d.minutes ? `<span class="tag">${d.minutes} ${L('min', 'د')}</span> ` : ''}${tag}</span></div>${line(L('Set-up', 'التجهيز'), d.setup)}${line(L('Cues', 'إشارات'), d.cues)}${line(L('Easier', 'أسهل'), d.easier)}${line(L('Harder', 'أصعب'), d.harder)}${line(L('What good looks like', 'شكلها لما تبقى كويسة'), d.good)}${line(L('Why this drill', 'ليه التمرين ده'), d.why)}${line(L('Rule', 'القاعدة'), d.rule)}
   ${src.name ? `<div class="tiny muted">${L('Source', 'المصدر')}: ${src.url && isOwnerish() ? `<a href="${esc(src.url)}" target="_blank" rel="noopener">${esc(src.name)}</a>` : esc(src.name)}</div>` : ''}</div>`;
}
function drillsBox(cats) {
  ensureDrills();
  const skillsList = cats.map(c => subsOf(c).filter(k => +k.phase === 1)).reduce((a, b) => a.concat(b), []);
  const with_ = skillsList.filter(k => drillsOf(k.id).length || practicesOf(k.id).length);
  if (!with_.length) return `<p class="tiny muted">${L('Drill cards for today’s sub-skills are not loaded yet.', 'كروت التمارين لمهارات اليوم مش محمّلة لسه.')}</p>`;
  return `<h3>${L('Drills for today’s sub-skills', 'تمارين مهارات اليوم')}</h3><div class="drills">${with_.map(k => `<details class="drillsk"><summary><b>${esc(skillName(k.id))}</b> <span class="tag">${drillsOf(k.id).length + practicesOf(k.id).length}</span></summary>${drillsOf(k.id).map(drillCard).join('')}${practicesOf(k.id).map(d => `<div class="small muted" style="margin-top:6px">${L('Standard practice (the same simple exercise every time, so readings compare)', 'تمرين معياري (نفس التمرين البسيط كل مرة عشان القراءات تتقارن)')}</div>` + drillCard(d)).join('')}</details>`).join('')}</div>`;
}

/* ---------- the plan engine view: bands, sizes, staffing, per-child notes, stations */
function groupsBox(s) {

function queueTag(sid, pid, field, v) {
  const mine = (D().obs || []).filter(o => o.session_id === sid && o.player_id === pid && o.source === 'coach' && o.rater === S.me.id && /^K\d/.test(o.skill) && o.state !== 'cleared');

    obPut({ key: 'cr|' + sid + '|' + pid + '|' + cat, a: 'coachrate', sid, item, local: [['obs', Object.assign({}, o, { approach: item.approach, outcome: item.outcome })]] }) });
  return true;
}

/* ---------- the coach's Today: per-child brief lines */
function briefLines(s) {
  const roster = sessionRoster(s); const t = s.date; const notes = D().notes || []; const pend = D().pending || []; const since = addDays(todayStr(), -30);
  const prevSes = sessionsDone().filter(x => x.date < t && x.id !== s.id)[0];
  const focus = catsOf(s);
  return roster.map(p => {
    const parts = []; const c = ctxOn(p.id, t) || ctxOn(p.id, addDays(t, -1)) || (todayStr() < t ? ctxOn(p.id, todayStr()) : null);   // a check-in sent today still counts for the coming session
    if (c) { const f = c.forward === 'looking_forward' ? '😃 ' + L('excited', 'متحمس') : c.forward === 'reluctant' ? '😕 ' + L('reluctant', 'متردد') : ''; const ct = ctxText(Object.assign({}, c, { note: isEval() ? '' : c.note })); if (f || ct) parts.push([f, ct].filter(Boolean).join(' · ')) }
    const pn = prevSes ? notes.filter(n => n.player_id === p.id && n.session_id === prevSes.id && n.by_role !== 'parent').pop() : null; if (pn) parts.push(`💬 ${esc(pn.by)}: ${esc(String(pn.text).slice(0, 90))}`);
    const close = pend.filter(x => x.key.indexOf(p.id + '|') === 0 && focus.indexOf((skillById(x.key.split('|')[1]) || {}).cat) >= 0); if (close.length) parts.push(`° ${L('close to a level change', 'قريب من تغيير مستوى')}: ${close.slice(0, 2).map(x => esc(skillName(x.key.split('|')[1]))).join('، ')}`);
    const concern = notes.filter(n => n.player_id === p.id && (n.type === 'concern' || n.pillar === 'concern') && String(n.at).slice(0, 10) >= since).length; if (concern) parts.push(`<span class="tag warn">${L('concern watch', 'متابعة قلق')} · ${concern}</span>`);
    if (p.medical_short) parts.push(`<span style="color:var(--flame)">⚕ ${esc(p.medical_short)}</span>`);
    if (healthHoldOn(p.id, t)) parts.push(`<span class="tag warn">${L('health hold: light load', 'توقف صحي: حمل خفيف')}</span>`);
    const hd = (D().homedone || []).filter(h => h.player_id === p.id && h.week >= weekStart(addDays(t, -7))).some(h => +h.done > 0 || h.done === 'yes' || h.done === true) || (c && +c.home_done > 0); if (hd) parts.push(`🏠 ${L('home activity done', 'النشاط البيتي اتعمل')}`);
    const wk = worksLine(p.id); if (wk) parts.push(wk.replace(/^ · /, ''));
    return parts.length ? `<li><b>${esc(p.name)}</b> · ${parts.join(' · ')}</li>` : '';
  }).filter(Boolean);
}

  const el = ev.target; if (!el || el.id !== 'ctFile' || !el.files || !el.files[0]) return;
  const put = t => { S.ctMsg = t; const box = document.getElementById('ctBox'); if (box) box.textContent = t };   // v4.2.3: the message stays after the page is drawn again
  try {
    put(L('Loading the content file…', 'جارٍ تحميل ملف المحتوى…'));
    const text = await el.files[0].text(); const j = await act('content_put', { text }, true);
    put('✓ ' + L(`Content file loaded (${j.parts} parts).`, `ملف المحتوى اتحمّل (${j.parts} جزء).`)); await load(); rerender();
  } catch (e) { put('⚠ ' + (e.message || e)) }
});

   modal and never kept in S or the cache. Everything here hangs off the core registries; the only core hooks are PR()/ctxSport(),
   MOD.playerTabs and the D().plan getter below. */

/* ---------- the plan follows the sport of what is open (the server sends planF beside the basketball plan) */
const applyLoad0_c5 = applyLoad;
applyLoad = function (j) { const r = applyLoad0_c5(j); sportifyPlan(); return r; };
function sportifyPlan() {
  if (!S.D || !S.D.planF) return; const base = S.D.plan; const pf = S.D.planF;
  try { Object.defineProperty(S.D, 'plan', { configurable: true, enumerable: true, get() { return ctxSport() === 'football' ? pf : base; } }); } catch (e) { }
}
/* a coach who works in one sport only sees that sport's upcoming sessions */
const upcoming0_c5 = upcoming;
upcoming = function (n, from) { const l = upcoming0_c5(n, from); if (!footballOn() || !isCoach()) return l; const mine = (S.me && S.me.sports) || []; return mine.length ? l.filter(x => mine.indexOf(x.sport || 'basketball') >= 0) : l; };
/* a level recorded by the coach (partner_light) says so wherever a level chip is drawn for staff */
const stateChip0_c5 = stateChip;
stateChip = function (pid, sk) { let h = stateChip0_c5(pid, sk); const s = st(pid, sk); if (s && s.src === 'coach' && !isParent()) h += ` <span class="tag c5-coachrec">${L('coach-recorded', 'سجّلها المدرب')}</span>`; return h; };

const FIELDS5 = [['id_sealed', 'National ID number', 'الرقم القومي'], ['medical_sealed', 'Sealed medical note', 'الملاحظة الطبية المغلقة']];
function sealedTab(p) {

  ${reqs.length ? `<h3>${L('Requests to the family', 'طلبات للعيلة')}</h3><ul class="small">${reqs.slice(0, 6).map(r => `<li>${fmtDS(String(r.at).slice(0, 10))} · ${esc(r.detail || '')} · <span class="tag ${r.status === 'approved' ? 'ok' : r.status === 'declined' ? 'attn' : ''}">${esc(r.status)}</span></li>`).join('')}</ul>` : ''}

}

const EL = () => D().elite || null;
const elBand = (id, en, ar) => esc(L(en || id || 'Age not set', ar || id || 'السن غير محدد'));
function eliteHomeCard() {

/* ---------- offline-safe family writes: a parent's tap is kept on the phone until the Sheet confirms it */
const famNow = () => todayStr() + new Date().toISOString().slice(10);   // the academy's date with this phone's time: local rows line up with what the server will stamp
/* every parent or child tap goes through the outbox: kept on the phone, sent when the signal allows, the answer lands in the right local table */
function queueFam(kind, rec, local) { obPut({ key: 'fam|' + kind + '|' + (rec.id || rec.player_id + '|' + (rec.date || rec.week || rec.month || '')), a: 'family', body: { kind, rec }, kind: (local && local[0] && local[0][0]) || 'none', local: local || [] }); toast('✓ ' + w('saved')) }
function queueAct(a, body, kind, local, key) { obPut({ key: key || (a + '|' + ((body.rec && body.rec.id) || body.id || (Date.now() + Math.random()))), a, body, kind: kind || 'none', local: local || [] }); toast('✓ ' + w('saved')) }
const myKid = pid => P(pid) || parentKid();

/* ---------- the in-app inbox */
const TOPICS = [['development', 'My child’s development', 'تطوّر طفلي', 'coach'], ['logistics', 'Days, times, place', 'المواعيد والمكان', 'admin'], ['money', 'Fees', 'الاشتراكات', 'admin'], ['support', 'Something personal / support', 'حاجة شخصية / دعم', 'owner'], ['meeting', 'I’d like a meeting', 'عايز اجتماع', 'admin'], ['other', 'Other', 'حاجة تانية', 'admin'], ['home_done', 'Home activity done', 'النشاط البيتي اتعمل', 'coach']];
const topicName = t => lab(TOPICS, t);
const toName = t => ({ coach: L('the coach', 'الكابتن'), admin: L('the office', 'المكتب'), owner: L('the academy owners', 'أصحاب الأكاديمية'), parent: L('you', 'ليكم') })[t] || t;
function threadsFor(pid) { const by = {}; (D().inbox || []).filter(m => !pid || m.player_id === pid).forEach(m => { const k = m.thread || m.id; (by[k] = by[k] || []).push(m) }); return Object.keys(by).map(k => by[k].sort((a, b) => String(a.at).localeCompare(String(b.at)))).sort((a, b) => String(b[b.length - 1].at).localeCompare(String(a[a.length - 1].at))) }
function msgRow(m) { const mine = S.me && (m.from_id === S.me.id || (isParent() && m.from_role === 'parent') || (!isParent() && m.from_role !== 'parent' && m.from_role !== 'child')); return `<div class="msg ${mine ? 'mine' : ''}"><div class="small">${esc(m.text)}</div><div class="tiny muted">${esc(m.from_name || '')}${m.from_role ? ' · ' + (m.from_role === 'child' ? L('child', 'الطفل') : roleName(m.from_role)) : ''} · ${fmtDS(String(m.at).slice(0, 10))}${m.urgent === 'yes' ? ' · <b style="color:var(--flame)">' + L('urgent', 'عاجل') + '</b>' : ''}${m.read_at ? ' · ✓✓' : ''}</div></div>` }
function inboxModal(pid) {
  const p = P(pid); const threads = threadsFor(pid); const unread = (D().inbox || []).filter(m => m.player_id === pid && !m.read_at && (isParent() ? m.to_role === 'parent' : m.to_role !== 'parent')).map(m => m.id);
  if (unread.length) act('inbox_read', { ids: unread }, true).then(j => { (j.recs || []).forEach(r => upsertLocal('inbox', r)) }).catch(() => { });
  modal(`<h2>${L('Messages', 'الرسائل')} · ${esc(p ? p.name : '')}</h2><p class="tiny muted">${L('We aim to answer within 24 hours.', 'بنحاول نرد في خلال 24 ساعة.')}</p>
   ${isParent() ? `<form id="inboxForm" data-pid="${pid}" class="compose"><label class="f">${L('About', 'بخصوص')}<select class="in" name="topic">${TOPICS.filter(t => t[0] !== 'home_done').map(t => `<option value="${t[0]}">${esc(L(t[1], t[2]))} → ${esc(toName(t[3]))}</option>`).join('')}</select></label><label class="f">${L('Your message', 'رسالتكم')}<textarea class="in" name="text" required maxlength="1500"></textarea></label><div class="row wrap"><label class="row small"><input type="checkbox" name="urgent"> ${L('Urgent', 'عاجل')}</label><label class="row small"><input type="checkbox" name="meeting"> ${L('I’d like a meeting', 'عايز اجتماع')}</label><button class="btn small" type="submit">${L('Send', 'أرسل')}</button></div></form>` : `<form id="inboxStaffForm" data-pid="${pid}" class="compose"><label class="f">${L('Message to the family', 'رسالة للعيلة')}<textarea class="in" name="text" required maxlength="1500"></textarea></label><div class="row"><select class="in" name="topic" style="max-width:200px">${TOPICS.filter(t => t[0] !== 'home_done').map(t => `<option value="${t[0]}">${esc(L(t[1], t[2]))}</option>`).join('')}</select><button class="btn small" type="submit">${L('Send', 'أرسل')}</button></div></form>`}
   <div class="threads">${threads.length ? threads.map(th => `<div class="thread"><div class="row sp"><b>${esc(topicName(th[0].topic))}</b><span class="tiny muted">${L('to', 'إلى')} ${esc(toName(th[0].to_role))}</span></div>${th.map(msgRow).join('')}<form id="inboxReply" data-pid="${pid}" data-thread="${esc(th[0].thread || th[0].id)}" data-topic="${esc(th[0].topic)}" class="row"><input class="in grow" name="text" required maxlength="1500" placeholder="${L('Reply…', 'رد…')}"><button class="btn small" type="submit">↩</button></form></div>`).join('') : empty(L('No messages yet.', 'مفيش رسائل لسه.'))}</div>
   <button class="btn ghost" data-act="modal-close">${w('close')}</button>`);
}
regAction('inbox-open', d => inboxModal(d.pid));
async function sendInbox(pid, topic, text, extra) {
  const id = 'ib_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); const body = Object.assign({ id, player_id: pid, topic, text }, extra || {});
  if (isParent()) {   // a parent's message is kept on the phone and sent when the signal allows
    const rec = { id, from_id: S.me.id, from_name: S.me.name, from_role: 'parent', player_id: pid, topic, text, thread: (extra && extra.thread) || id, urgent: extra && extra.urgent ? 'yes' : '', read_at: '', at: famNow(), to_role: (TOPICS.find(t => t[0] === topic) || [])[3] || 'admin' };
    queueAct('inbox_send', body, 'inbox', [['inbox', rec]], 'ib|' + id); return rec;
  }
  const j = await act('inbox_send', body); upsertLocal('inbox', j.rec); return j.rec }
regForm('inboxForm', async (o, f) => { await sendInbox(f.dataset.pid, o.topic, o.text, { urgent: !!o.urgent, meeting: !!o.meeting }); if (o.meeting) upsertLocal('requests', { id: 'rq_meeting_' + f.dataset.pid + '_' + todayStr(), player_id: f.dataset.pid, type: 'meeting', status: 'open', at: new Date().toISOString() }); inboxModal(f.dataset.pid) });
regForm('inboxStaffForm', async (o, f) => { await sendInbox(f.dataset.pid, o.topic, o.text); inboxModal(f.dataset.pid) });
regForm('inboxReply', async (o, f) => { await sendInbox(f.dataset.pid, f.dataset.topic, o.text, { thread: f.dataset.thread }); inboxModal(f.dataset.pid) });

function famStaffCard(p) {

   ${pr.length && isOwnerish() ? `<div class="notice attn"><b>${L('Pressure signs (staff only)', 'علامات ضغط (للفريق فقط)')}</b><ul class="small">${pr.map(r => `<li>${L(...(REASON[r] || [r, r]))}</li>`).join('')}</ul><p class="tiny muted">${L('Never shown to the child or the family as a flag; a reason for a kind conversation.', 'لا تُعرض للطفل أو العيلة كعلامة؛ ده سبب لمكالمة لطيفة.')}</p></div>` : ''}
   <h3>${L('One-skill journey (N9)', 'رحلة مهارة واحدة')}</h3>${js.length ? `<div class="list">${js.slice(0, 3).map(j => `<div class="item" style="cursor:default;flex-wrap:wrap"><div class="grow"><b>${esc(L(j.focus_en, j.focus_ar))}</b> <span class="tag ${j.status === 'active' ? 'info' : j.status === 'closed' ? 'ok' : ''}">${L(...(JSTAT[j.status] || [j.status, j.status]))}</span>${j.result ? ' · ' + lab([['moved', 'Grew', 'كبرت'], ['stable', 'Steady', 'ثابتة'], ['not_enough', 'Not enough evidence', 'أدلة مش كفاية']], j.result) : ''}<div class="sub">${esc(j.term || '')} · ${j.start ? fmtDS(j.start) : ''}${j.end ? ' → ' + fmtDS(j.end) : ''} · ${esc(j.by || '')}</div></div>${j.status === 'proposed' ? `<select class="in" style="max-width:220px" data-jsel="${j.id}">${(D().journey_foci || []).map(f => `<option value="${f.id}" ${f.id === j.focus ? 'selected' : ''}>${esc(L(f.en, f.ar))}</option>`).join('')}</select><button class="btn small" data-act="jr-set" data-id="${j.id}" data-v="active">${L('Approve', 'اعتمد')}</button><button class="link small" data-act="jr-set" data-id="${j.id}" data-v="declined">${L('Not now', 'ليس الآن')}</button>` : j.status === 'active' ? `<button class="btn ghost small" data-act="jr-close-open" data-id="${j.id}">${L('End-of-term result', 'نتيجة آخر الترم')}</button>` : ''}</div>`).join('')}</div>` : `<p class="small muted">${L('Proposed after a skills day (session kind: skills day).', 'بتتقترح بعد يوم المهارات (نوع الحصة: يوم مهارات).')}</p>`}

  <div class="ix-grid ix-coaches">${list.map(c => `<div class="card ix-coach" id="ic-coach-${esc(c.id)}"><div class="row"><span class="av">${esc(initials(c.name))}</span><h3>${ixName(c.name)}</h3></div>
    <div class="kpis">${kpiTile(L('Sessions led', 'حصص قادها'), num(c.sessions), { n: c.sessions })}${kpiTile(L('Attendance in his sessions', 'الحضور في حصصه'), ixVal(c.attendance.value, 'rate', 'nodata'), { n: c.attendance.n, kind: 'rate' })}${kpiTile(L('Standout notes written', 'ملاحظات مميزة كتبها'), num(c.standouts), { n: c.standouts })}${kpiTile(L('Family satisfaction (1–5)', 'رضا العيلات (1–5)'), ixVal(c.satisfaction.value, 'avg', c.satisfaction.hidden_reason), { n: c.satisfaction.n, kind: 'avg' })}${kpiTile(L('Plan usefulness (1–5)', 'فايدة الخطة (1–5)'), ixVal(c.useful.value, 'avg', c.useful.hidden_reason), { n: c.useful.n, kind: 'avg' })}</div>
    <p class="small"><b>${L('Calibration vs the evaluators', 'المعايرة مع المقيّمين')}:</b> ${cal(c.calibration)}${c.calibration && c.calibration.verdict && c.calibration.verdict !== 'not_enough' ? ' · ' + esc(verdName(c.calibration.verdict)) : ''}</p>
    <p class="tiny muted">${L('Satisfaction is the owner’s view only and needs 5 answers from families of children in his sessions.', 'الرضا للمالك بس ومحتاج 5 إجابات من عيلات أطفال حصصه.')}</p></div>`).join('')}</div>`;
}

/* ---------- actions: Done / Dismiss with reason → the `actions` table; tap-through from the hero */
async function ixWrite(d, status, reason) {
  const rec = { id: newId('ac'), insight: d.insight, card: d.card, action: d.action, status, reason: reason || '', metric: d.metric || '', value_at: d.value === '' || d.value == null ? '' : +d.value, by: S.me.name, at: new Date().toISOString() };
  await act('action_set', { rec }, true); upsertLocal('actions', rec);
  const it = ixD(); if (it) {                                             // show it at once; the server recomputes on the next load
    Object.keys(it.cards || {}).forEach(k => (it.cards[k].recs || []).forEach(r => { if (r.id !== d.insight) return; r.actions.forEach(a => { if (a.id === d.action) a.state = { status, reason: rec.reason, by: rec.by, at: rec.at, value_at: rec.value_at === '' ? null : rec.value_at, now: rec.value_at === '' ? null : rec.value_at, moved: 0 } }); if (r.actions.every(a => a.state)) it.hero.look = it.hero.look.filter(x => x.id !== r.id) }));
    (it.setup.items || []).forEach(x => { if (x.insight === d.insight && status === 'dismissed') x.dismissed = { reason: rec.reason, by: rec.by, at: rec.at } }); it.hero.look = it.hero.look.filter(x => x.id !== d.insight || d.card !== 'setup');
    it.hero.counts = { high: it.hero.look.filter(x => x.level === 'high').length, medium: it.hero.look.filter(x => x.level === 'medium').length, low: it.hero.look.filter(x => x.level === 'low').length };
  }
  modal(''); rerender();
}
regAction('ix-done', async d => { await ixWrite(d, 'done', '') });

regAction('ix-dismiss', d => { S.ixDismiss = Object.assign({}, d); modal(`<h2>${L('Dismiss with a reason', 'تجاهل مع سبب')}</h2><p class="small muted">${L('The reason is kept with the recommendation so next period shows why it was set aside.', 'السبب بيتحفظ مع التوصية، فالفترة الجاية بتبيّن اتجاهلت ليه.')}</p><form id="ixDismissForm"><label class="f">${L('Reason', 'السبب')}<textarea class="in" name="reason" required placeholder="${L('e.g. already handled by phone; group is temporary; not a priority this term', 'مثلًا: اتعالجت بالتليفون؛ المجموعة مؤقتة؛ مش أولوية الفصل ده')}"></textarea></label><div class="row"><button class="btn" type="submit">${L('Dismiss', 'تجاهل')}</button><button class="btn ghost" type="button" data-act="modal-close">${w('cancel')}</button></div></form>`) });
