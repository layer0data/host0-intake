<html lang="en">

<meta name="robots" content="noindex,nofollow">
<title>Gymnastics academy · Intake</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@600;700&display=swap">
<style>
/* Layout: one screen at a time on a phone. Sticky header (progress, saved), cards in the middle, sticky Back · Next bar. Review screen sends by WhatsApp and opens the printable Academy Profile. */
:root{
  --bg:#F2F4F3; --surface:#FFFFFF; --sunk:#E7ECEA; --ink:#15201D; --muted:#5B6763; --line:#D3DBD8;
  --accent:#2F6FAE; --accent-ink:#FFFFFF; --accent-soft:#DFEAF5; --sel:#15201D; --selink:#FFFFFF; --warn:#9A5B06; --warn-soft:#FBEEDB;
  --display:"IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --arabic:"IBM Plex Sans Arabic","Geeza Pro","Segoe UI",Tahoma,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0F1614; --surface:#18211F; --sunk:#111917; --ink:#E7EEEB; --muted:#9DABA6; --line:#2B3734;
  --accent:#7DB2E4; --accent-ink:#0F1614; --accent-soft:#1A2F44; --sel:#E7EEEB; --selink:#0F1614; --warn:#F0B35A; --warn-soft:#3A2C17; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--body);-webkit-text-size-adjust:100%}
body.rtl{font-family:var(--arabic)}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15;text-wrap:balance}
body.rtl h1,body.rtl h2,body.rtl h3{font-family:var(--arabic)}
p{margin:0}
.top{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px}
.toprow{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:10px;justify-content:space-between}
.brand{font:700 15px var(--display);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brandwrap{display:flex;align-items:center;gap:8px;min-width:0}
.hostmark{height:26px;width:auto;flex:0 0 auto}
.byhost{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted);font-weight:600;direction:ltr}
body.rtl .byhost{justify-content:flex-end}
.byhost img{height:38px;width:auto}
.hostfoot{margin-top:18px;padding-top:16px;border-top:1px solid var(--line);display:grid;gap:6px;justify-items:center;text-align:center;font-size:13px;color:var(--muted)}
.hostfoot img{height:34px;width:auto}
.hostfoot a{color:var(--ink);text-decoration:none;font-weight:600}
.ct{display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:center}
.subok{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.o .rk{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:11px;background:var(--selink);color:var(--sel);font-size:12px;font-weight:700;margin-inline-end:8px;font-variant-numeric:tabular-nums}
.addbtn{justify-self:start}
.pdfsheet{position:absolute;left:-12000px;top:0;width:760px;background:#fff;color:#15201D;--bg:#fff;--surface:#fff;--sunk:#F2F4F3;--ink:#15201D;--muted:#5B6763;--line:#D3DBD8;--accent:var(--pdf-accent,#2F6FAE);--accent-ink:#fff;--accent-soft:var(--pdf-soft,#DFEAF5);--sel:#15201D;--selink:#fff;font:15px/1.5 var(--body);color-scheme:light}
.pdfsheet[dir=rtl]{font-family:var(--arabic)}
.pdfsheet *{letter-spacing:0!important}
.pdfsheet .pf{padding:0;max-width:none;display:block}
.pdfsheet .pf>*+*{margin-top:14px}
.pdfsheet .pfsec{border:0;border-top:2px solid #D3DBD8;border-radius:0;padding:14px 0 4px;background:#fff}
.pdfsheet .pfhead{border-radius:12px}
.pdfsheet .tbl{overflow:visible}
.btn[disabled]{opacity:.6;cursor:default}
.pflogo{direction:ltr;justify-self:start;background:#fff;border-radius:9px;padding:5px 9px;display:inline-flex;align-items:center;gap:8px;color:#5B6763;font-size:11px;font-weight:600}
.pflogo img{height:30px;width:auto}
.pffoot{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:4px;justify-items:center;text-align:center;font-size:12px;color:var(--muted)}
.pffoot img{height:36px;width:auto}
.pffoot a{color:inherit;text-decoration:none}
body.rtl .brand{font-family:var(--arabic)}
.lang{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex:0 0 auto}
.lang button{font:600 13px var(--body);padding:6px 10px;border:0;background:var(--surface);color:var(--ink);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--sel);color:var(--selink)}
.lang button+button{border-inline-start:1px solid var(--line)}
.progress{max-width:720px;margin:8px auto 0;display:grid;gap:4px}
.meter{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s}
.meta{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
.meta button{font:600 13px var(--body);background:none;border:0;color:var(--accent);cursor:pointer;padding:0}
main{max-width:720px;margin:0 auto;padding:18px 16px 140px;display:grid;gap:14px}
.stephead{display:grid;gap:6px}
.stephead h2{font-size:26px}
.why{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:10px;min-width:0}
.card.done{border-color:var(--accent)}
.card.need,.sess.need,.row.need{border-color:var(--warn);box-shadow:0 0 0 2px var(--warn-soft)}
.qq{font-weight:600;font-size:17px;line-height:1.4}
.hint{font-size:12.5px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.note{font-size:14px;color:var(--ink);background:var(--sunk);border-radius:10px;padding:8px 10px}
details.why summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:13.5px;width:max-content;max-width:100%}
details.why p{margin-top:4px;font-size:14.5px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.o{font:500 15px var(--body);padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-align:start;min-height:46px;max-width:100%}
.o.sm{font-size:14px;padding:7px 11px;min-height:38px;border-radius:10px}
body.rtl .o{font-family:var(--arabic)}
.o[aria-pressed="true"]{background:var(--sel);color:var(--selink);border-color:var(--sel)}
.o.own{border-style:dashed}
.o.x{border-style:dotted;color:var(--muted)}
.o.x[aria-pressed="true"]{color:var(--selink)}
.see{font-size:14px;padding:9px 11px;border-radius:10px;background:var(--accent-soft);display:grid;gap:2px}
.see b{font-size:12px;letter-spacing:.03em;color:var(--accent);text-transform:uppercase}
body.rtl .see b{text-transform:none;letter-spacing:0}
.helpln{font-size:14px;padding:9px 11px;border-radius:10px;border:1px solid var(--accent);display:grid;gap:2px}
.helpln b{color:var(--accent);font-size:13px}
input[type=text],input[type=number],input[type=time],textarea{width:100%;font:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
textarea{min-height:96px;resize:vertical}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 10px)}
.barrow{max-width:720px;margin:0 auto;display:flex;gap:8px;align-items:center}
.btn{font:600 16px var(--body);padding:13px 18px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer;min-height:48px;text-align:center;text-decoration:none;display:inline-block}
body.rtl .btn{font-family:var(--arabic)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.wide{flex:1}
.btn.small{font-size:13px;padding:9px 10px;min-height:40px;white-space:nowrap}
.barrow .btn{white-space:nowrap}
@media (max-width:420px){.barrow .ghost:first-child{padding-inline:12px}}
.notice{font-size:14px;padding:10px 12px;border-radius:10px;background:var(--accent-soft)}
.welcome{display:grid;gap:14px}
.welcome h1{font-size:clamp(30px,8vw,42px)}
.welcome .lead{font-size:17px;color:var(--muted)}
.choice{display:grid;gap:8px}
.costs{display:grid;gap:8px}
.cost{display:grid;grid-template-columns:120px minmax(0,1fr);gap:10px;padding:10px 12px;border-radius:10px;border:1px solid var(--line)}
.cost b{font-size:14px}
@media (max-width:480px){.cost{grid-template-columns:1fr;gap:2px}}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font:inherit;font-size:14px;padding:4px}
.addrow{display:flex;gap:8px;flex-wrap:wrap}
.addrow input{flex:1 1 180px;width:auto}
.row{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:8px}
.rowhead{display:flex;gap:8px;align-items:center}
.rowhead input{flex:1}
.lbl{font-size:12.5px;color:var(--muted);font-weight:600}
label.lbl{display:grid;gap:4px}
.sess{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:8px;background:var(--bg)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:480px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg)}
.tile b{display:block;font:700 22px var(--display);font-variant-numeric:tabular-nums}
.tile span{font-size:12.5px;color:var(--muted)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:start;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600}
td.n{font-variant-numeric:tabular-nums}
.menu{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.35);display:flex;justify-content:center;align-items:flex-end}
.sheet{background:var(--surface);width:100%;max-width:720px;max-height:80vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 16px);display:grid;gap:6px}
.sheet button.step{display:flex;justify-content:space-between;gap:10px;text-align:start;font:500 15px var(--body);padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
body.rtl .sheet button.step{font-family:var(--arabic)}
.sheet button.step.cur{border-color:var(--accent);background:var(--accent-soft)}
.sheet .n{color:var(--muted);white-space:nowrap}
.rv{display:grid;gap:10px}
.rvsec{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:6px;min-width:0}
.rvhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.rvhead h3{font-size:17px}
.rvrow{font-size:14.5px;display:grid;gap:1px;padding-top:6px;border-top:1px solid var(--line)}
.rvrow .q{color:var(--muted);font-size:13.5px}
.rvrow .e{color:var(--muted);font-style:italic}
.fold{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);color:var(--ink);font:500 14.5px var(--body);cursor:pointer}
body.rtl .fold{font-family:var(--arabic)}
.fold .fl{min-width:0}.fold .fe{color:var(--accent);font-weight:600;font-size:13.5px;white-space:nowrap}
.fold .miss{color:var(--warn);font-weight:600}
.optcard{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px dashed var(--line);border-radius:12px;padding:12px}
pre.out{white-space:pre-wrap;word-break:break-word;font:12.5px/1.5 ui-monospace,Menlo,monospace;background:var(--sunk);border-radius:10px;padding:12px;max-height:220px;overflow:auto;margin:0}
.ok{color:var(--accent);font-weight:600}
/* Academy Profile (screen overlay + print) */
#profile{position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto}
.pf{max-width:820px;margin:0 auto;padding:16px 16px 60px;display:grid;gap:16px}
.pfbar{display:flex;gap:8px;flex-wrap:wrap;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:2}
.pfhead{border-radius:14px;background:var(--accent);color:var(--accent-ink);padding:18px;display:grid;gap:4px}
.pfhead h1{font-size:28px}
.pfhead .stamp{font-size:13px;opacity:.9}
.pfsec{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:8px}
.pfsec h2,.pfsec p b{break-after:avoid}
.pfsec tr,.pfrow,.tiles{break-inside:avoid}
.pfsec h2{font-size:19px}
.pfrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:10px;font-size:14px;padding:5px 0;border-top:1px solid var(--line)}
.pfrow .q{color:var(--muted)}
@media (max-width:520px){.pfrow{grid-template-columns:1fr;gap:0}}
@media print{
  @page{margin:14mm 14mm 16mm}
  body{background:#fff}
  body.printing > *:not(#profile){display:none!important}
  #profile{position:static;overflow:visible;background:#fff}
  .pfbar{display:none!important}
  .pfsec{border-color:#ccc;display:block}
  .pfsec>*+*{margin-top:8px}
  .pf{display:block}
  .pf>*+*{margin-top:12px}
  .pfhead{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .tile{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media (prefers-reduced-motion:reduce){.meter i{transition:none}}
</style>
<style id="brandcss"></style>
<style id="pagecss"></style>

const D={"sections": [{"id": "s1", "en": "Your academy", "ar": "أكاديميتك", "why": "So the platform carries your name and your people from the first day.", "why_ar": "لتحمل المنصة اسم أكاديميتك وفريقك من اليوم الأول.", "part": "core", "sp": "all"}, {"id": "s1g", "en": "Your programmes", "ar": "برامجكم", "why": "So the platform fits how your gym works.", "why_ar": "لتناسب المنصة طريقة عمل صالتكم.", "part": "core", "sp": "gym"}, {"id": "s2", "en": "Branches, sessions and coaches", "ar": "الفروع والحصص والمدربون", "why": "One picture of your academy: where you train, when, how many {P} and with which coaches. You can change all of it later in settings.", "why_ar": "صورة واحدة لأكاديميتك: أين تتدرّبون، ومتى، وكم عدد {P}، ومع أي مدرّبين. يمكنك تغيير كل ذلك لاحقًا من الإعدادات.", "part": "core", "sp": "all"}, {"id": "s3", "en": "Coaches", "ar": "المدربون", "why": "Coaches are the academy. We start from how your team works today.", "why_ar": "المدرّبون هم الأكاديمية. نبدأ من طريقة عمل فريقك اليوم.", "part": "core", "sp": "all"}, {"id": "s4", "en": "New {P}", "ar": "اللاعبون الجدد", "why": "The first weeks decide whether a new family stays. We start from how it works today.", "why_ar": "الأسابيع الأولى تحدّد هل تبقى العائلة الجديدة. نبدأ من طريقة العمل اليوم.", "part": "core", "sp": "all"}, {"id": "s5", "en": "Families and messages", "ar": "العائلات والرسائل", "why": "So the right message reaches the right families, the way you already write.", "why_ar": "لتصل الرسالة المناسبة إلى العائلات المناسبة، بالطريقة التي تكتب بها اليوم.", "part": "core", "sp": "all"}, {"id": "s6", "en": "Your goals", "ar": "أهدافك", "why": "Last step. What you want from this year, and how we will help with each.", "why_ar": "الخطوة الأخيرة. ماذا تريد من هذا العام، وكيف سنساعدك في كل هدف.", "part": "core", "sp": "all"}, {"id": "o1", "en": "Website, photos and videos", "ar": "الموقع والصور والفيديو", "why": "Optional. What is free, what costs money, and what we suggest.", "why_ar": "اختياري. ما المجاني، وما يكلّف، وما نقترحه.", "part": "opt", "sp": "all"}, {"id": "o2", "en": "Market and growth", "ar": "السوق والنمو", "why": "Optional. The market around you and what brings families who stay.", "why_ar": "اختياري. السوق من حولك وما يجلب عائلات تبقى.", "part": "opt", "sp": "all"}, {"id": "o3", "en": "Matches and team selection", "ar": "المباريات واختيار الفريق", "why": "Optional. Only if your {P} play matches.", "why_ar": "اختياري. فقط إن كان {Pn} يلعبون مباريات.", "part": "opt", "sp": "all"}], "questions": [{"id": "who", "sec": "s1", "type": "text", "req": true, "en": "Your name", "ar": "اسمك", "why": "So we know who answered and who to call back.", "why_ar": "لنعرف من أجاب ومن نتواصل معه.", "ph": "For example: Basem", "ph_ar": "مثلًا: باسم", "sp": "all", "see": "", "see_ar": ""}, {"id": "gname", "sec": "s1", "type": "text", "req": true, "en": "What is the name of your academy?", "ar": "ما اسم أكاديميتك؟", "why": "It appears on every screen, message and report.", "why_ar": "يظهر على كل شاشة ورسالة وتقرير.", "ph": "Academy name", "ph_ar": "اسم الأكاديمية", "sp": "all", "see": "", "see_ar": ""}, {"id": "year", "sec": "s1", "type": "year", "kind": "fact", "en": "In which year did {A} start?", "ar": "في أي عام بدأت {A}؟", "why": "Families trust an academy with a story. The year you started goes into your About page, your welcome message and your brief.", "why_ar": "العائلات تثق بأكاديمية لها قصة. عام البداية يظهر في صفحة «من نحن» ورسالة الترحيب ونبذة الأكاديمية.", "see": "“Since 2019” on your About page and in your welcome message to new families.", "see_ar": "«منذ 2019» في صفحة «من نحن» وفي رسالة الترحيب بالعائلات الجديدة.", "sp": "all"}, {"id": "team", "sec": "s1", "type": "multi", "kind": "fact", "en": "Who works with you, besides the coaches?", "ar": "من يعمل معك، غير المدرّبين؟", "why": "Coaches come in the next step. This is for the people who run the academy with you, so each gets the right access.", "why_ar": "المدرّبون في الخطوة التالية. هذا السؤال عن الأشخا const t=k=>fill(L(T[k][0],T[k][1])).replace(/\{H\}/g,L(PROVIDER.person,PROVIDER.personAr));
const isAns=a=>!!a&&((a.sel&&a.sel.length)||(a.own&&String(a.own).trim()));
const hasAny=(sel,l)=>sel.some(v=>l.includes(v));
function cond(c){
  if(c.coachRole)return st.S.coaches.some(x=>x.role===c.coachRole);
  const a=st.A[c.q];if(!isAns(a))return !c.any;const sel=a.sel||[];
  if(sel.includes('dk')||sel.includes('nd'))return true;
  if(c.any&&!hasAny(sel,c.any))return false;
  if(c.not&&hasAny(sel,c.not))return false;
  return true;
}
function vis(q){if(q.waOnly&&!st.S.wa)return false;if(q.id==='gname'&&ACADEMY.name)return false;return q.show?cond(q.show):true}
function optVis(q,o){const c=q.oshow&&q.oshow[o[0]];if(!c)return true;if(c.coachRole)return st.S.coaches.some(x=>x.role===c.coachRole);const a=st.A[c.q];if(!isAns(a))return true;const s=a.sel||[];if(s.includes('dk')||s.includes('nd'))return true;return hasAny(s,c.any||[])}
function optsFor(q){const b=(q.opts||[]).filter(o=>optVis(q,o));const tail=[];if(q.kind==='pref')tail.push(['nd',T.nd[0],T.nd[1]]);tail.push(['dk',T.dk[0],T.dk[1]]);return b.concat(tail)}
const secQs=sid=>QS.filter(q=>q.sec===sid&&vis(q));
const secById=id=>SECS.find(s=>s.id===id);

function steps(){const s=[{k:'welcome'}];CORE.forEach(id=>s.push({k:'sec',id}));s.push({k:'review'});OPT.forEach(id=>s.push({k:'sec',id,opt:true}));return s}
const reviewIdx=()=>steps().findIndex(s=>s.k==='review');

/* ---------- save / sync ---------- */
let saveTimer=null,syncTimer=null,syncing=false;
function save(now){
  if(VIEW||RESET)return;st.saved=Date.now();
  const doIt=()=>{try{localStorage.setItem(KEY,JSON.stringify(st));canStore=true}catch(e){canStore=false}showSaved()};
  clearTimeout(saveTimer);if(now)doIt();else saveTimer=setTimeout(doIt,250);
  if(st.started)syncRemote(false);
}
function sumObj(){const tt=totals();return {academy:titleNow(),branches:st.S.branches.map(b=>b.name).filter(Boolean),players:tt.players,groups:G().length,sessions:tt.sessW,coaches:st.S.coaches.length,na:naCount(),lang:st.lang,timetable:!!st.S.wa}}
function payload(final){return {summary:sumObj(),kind:'answers',sport:SPORT,academy:academy(),lang:st.lang,step:st.step,final:!!(final||st.submitted),readable:readable(),answers:pack(st.A),setup:st.S,optional:optStatus(),branches:st.S.branches.map(b=>({name:b.name})),device:st.dev||(st.dev='d'+Math.random().toString(36).slice(2,10)),at:new Date().toISOString()}}
async function post(body){const ctl=new AbortController();const tm=setTimeout(()=>ctl.abort(),25000);
  try{const r=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body),signal:ctl.signal});const j=await r.json();if(!j||!j.ok)throw new Error((j&&j.error)||'not ok');return j}finally{clearTimeout(tm)}}
async function submitNow(){
  if(!ENDPOINT||st.submitting)return;st.submitting=1;keep();
  const body=payload(true);
  try{const blob=await withTimeout(makePdf(),45000);body.pdf=await blobB64(blob);body.pdfName=pdfName()}catch(e){body.pdfError=String(e&&e.message||e)}
  let ok=false;try{await post(body);ok=true}catch(e){ok=false}
  st.submitting=0;if(ok){st.submitted=Date.now();st.subFail=0}else st.subFail=1;
  save(true);render();window.scrollTo(0,0);toast(ok?t('subOk').replace('{t}',fmtWhen(st.submitted)):t('subFail'))}
function fmtWhen(ms){const d=new Date(ms);return d.toLocaleString(isAr()?'ar':'en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}
function syncRemote(final){
  if(!ENDPOINT||VIEW)return;clearTimeout(syncTimer);
  syncTimer=setTimeout(async()=>{if(syncing)return;syncing=true;
    try{await post(payload(final))}catch(e){}
    syncing=false},final?0:4000);
}
function showSaved(){const el=document.getElementById('saved');if(!canStore||!st.saved||VIEW){el.textContent='';return}
  const d=new Date(st.saved);el.textContent='✓ '+t('savedAt').replace('{t}',d.toLocaleTimeString(isAr()?'ar':'en-GB',{hour:'2-digit',minute:'2-digit'}))}

/* ---------- cards ---------- */
function card(q){
  const a=st.A[q.id]||{sel:[],own:''};
  const hint=q.rank?t('rankHint'):q.type==='multi'?(q.max?L(`Choose up to ${q.max}`,`اختر حتى ${q.max}`):t('multi')):q.type==='single'?t('single'):q.type==='year'?t('year'):(t('text')+(q.req?' · '+t('req'):''));
  let h=`<div class="card ${isAns(a)?'done':''}" id="c-${q.id}"><p class="qq">${esc(qtitle(q))}</p><span class="hint">${esc(hint)}</span>`;
  const why=qt(q,'why');if(why)h+=`<details class="why"><summary>${esc(t('why'))}</summary><p>${esc(why)}</p></details>`;
  const note=qt(q,'note');if(note)h+=`<p class="note">${esc(note)}</p>`;
  if(q.type==='text')h+=`<input type="text" class="txt" id="i-${q.id}" data-q="${q.id}" value="${esc(a.own||'')}" placeholder="${esc(qt(q,'ph'))}" aria-label="${esc(qtitle(q))}" ${isAr()?'dir="rtl"':''}>`;
  else if(q.type==='year'){
    h+=`<div class="opts"><input type="number" inputmode="numeric" class="txt" id="i-${q.id}" data-q="${q.id}" value="${esc((a.sel||[]).includes('dk')?'':(a.own||''))}" placeholder="2019" min="2000" max="${new Date().getFullYear()}" aria-label="${esc(qtitle(q))}" style="max-width:160px">`+
      `<button type="button" class="o x" data-q="${q.id}" data-v="dk" aria-pressed="${(a.sel||[]).includes('dk')}">${esc(t('dk'))}</button></div>`;
  }else{
    h+=`<div class="opts">`+optsFor(q).map(o=>`<button type="button" class="o${EXCL.has(o[0])?' x':''}" data-q="${q.id}" data-v="${esc(o[0])}" aria-pressed="${(a.sel||[]).includes(o[0])}">${q.rank&&!EXCL.has(o[0])&&(a.sel||[]).includes(o[0])?`<span class="rk">${(a.sel||[]).filter(x=>!EXCL.has(x)).indexOf(o[0])+1}</span>`:''}${esc(otext(o))}</button>`).join('')+
      `<button type="button" class="o own" data-q="${q.id}" data-own="1" aria-pressed="${!!(a.ownOn||a.own)}">${esc(t('own'))}</button></div>`;
    if(a.ownOn||a.own)h+=`<input type="text" class="txt" id="o-${q.id}" data-q="${q.id}" value="${esc(a.own||'')}" placeholder="${esc(t('ownph'))}" aria-label="${esc(t('own'))}" ${isAr()?'dir="rtl"':''}>`;
    if(q.help){const sel=(a.sel||[]).filter(v=>q.help[v]);if(sel.length)h+=sel.map(v=>{const o=optsFor(q).find(x=>x[0]===v);return `<div class="helpln"><b>${esc(otext(o))} · ${esc(t('help'))}</b><span>${esc(fill(L(q.help[v][0],q.help[v][1])))}</span></div>`}).join('')}
  }
  const see=qt(q,'see');if(see)h+=`<div class="see"><b>${esc(t('see'))}</b><span>${esc(see)}</span></div>`;
  return h+'</div>';
}
function summary(q,a){if(!isAns(a))return t('empty');let r=0;const p=(a.sel||[]).map(v=>{if(v==='nd'||v==='dk')return t(v);const o=(q.opts||[]).find(x=>x[0]===v);const s=o?otext(o):v;return q.rank?(++r)+'. '+s:s});if(a.own)p.push(a.own);return p.join(' · ')}

const chips=(arr,cur,attrs,multi,withDk)=>{const list=withDk?arr.concat([['dk',T.dk[0],T.dk[1]]]):arr;return `<div class="opts">`+list.map(o=>{const on=multi?(cur||[]).includes(o[0]):cur===o[0];return `<button type="button" class="o sm${o[0]==='dk'?' x':''}" ${attrs} data-val="${esc(o[0])}" aria-pressed="${on}">${esc(fill(L(o[1],o[2])))}</button>`}).join('')+`</div>`};

const slotDays=g=>{const k=new Set();(g.slots||[]).forEach((s,i)=>(s.days||[]).forEach(d=>k.add(d+'@'+(s.time||('#'+i)))));return k.size};
const cname=id=>(st.S.coaches.find(c=>c.id===id)||{}).name;
function totals(){
  const S=st.S;const gs=G();
  const players=gs.reduce((n,g)=>n+(+g.players||0),0);
  const sessW=gs.reduce((n,g)=>n+slotDays(g),0);
  const load=S.coaches.map(c=>{const my=gs.filter(g=>(g.coaches||[]).includes(c.id));
    return {c,groups:my.length,sess:my.reduce((n,g)=>n+slotDays(g),0),br:[...new Set(my.map(g=>g.b))].map(id=>(S.branches.find(b=>b.id===id)||{}).name).filter(Boolean)}});

}

function coachMiss(c){const m=[];if(!String(c.name||'').trim())m.push(t('coName'));if(!c.role)m.push(t('role'));return m}

  h+=`<div class="card"><button type="button" class="o" data-ed="wa" aria-pressed="${!!S.wa}">${esc(t('wa'))}</button>${S.wa?`<p class="note">${esc(t('waOn'))}</p>`:''}</div>`;
  // branches: names only
  h+=`<div class="card" id="ed-br"><p class="qq">${esc(t('brT'))}</p>
`+
    S.branches.map(b=>`<div class="rowhead" id="br-${b.id}"><input type="text" class="edin" id="bn-${b.id}" data-edin="br-name" data-id="${b.id}" value="${esc(b.name)}" placeholder="${esc(t('brName'))}" aria-label="${esc(t('brName'))}" ${isAr()?'dir="rtl"':''}><button type="button" class="link" data-ed="br-rm" data-id="${b.id}">${esc(t('remove'))}</button></div>`).join('')+

  h+=`<div class="card" id="ed-co"><p class="qq">${esc(t('coT'))}</p><p class="why">${esc(t('coLead'))}</p>

    S.coaches.map(c=>ui.co===c.id?`<div class="row" id="co-${c.id}">
       <div class="rowhead"><input type="text" class="edin" id="cn-${c.id}" data-edin="co-name" data-id="${c.id}" value="${esc(c.name)}" placeholder="${esc(t('coName'))}" aria-label="${esc(t('coName'))}" ${isAr()?'dir="rtl"':''}></div>
       <span class="lbl">${esc(t('role'))}</span>${chips(ED.role,c.role,`data-ed="co-set" data-f="role" data-id="${c.id}"`)}
       <span class="lbl">${esc(t('qual'))}</span>${chips(QUALS(),c.qual,`data-ed="co-tog" data-f="qual" data-id="${c.id}"`,true)}
       <span class="lbl">${esc(t('yrs'))}</span>${chips(ED.yrs,c.yrs,`data-ed="co-set" data-f="yrs" data-id="${c.id}"`)}
       <div class="opts"><button type="button" class="btn small" data-ed="done" data-k="co">${esc(t('done'))}</button><button type="button" class="link" data-ed="co-rm" data-id="${c.id}">${esc(t('remove'))}</button></div>

  if(S.wa)return h+sumHTML();

  S.branches.forEach(b=>{
    const gs=G().filter(g=>g.b===b.id);

      gs.map(g=>ui.gr===g.id?groupOpen(g):foldRow('gr',g.id,groupLine(g),groupMiss(g))).join('')+`<button type="button" class="btn ghost small addbtn" data-ed="gr-add" data-id="${b.id}">${esc(t('grAdd'))}</button></div>`;
  });
  return h+sumHTML();
}

    (g.slots||[]).map((sl,i)=>`<div class="sess">

       <div class="grid2"><label class="lbl">${esc(t('time'))}<input type="time" class="edin" id="slt-${g.id}-${i}" data-edin="sl-time" data-id="${g.id}" data-ix="${i}" value="${esc(sl.time||'')}"></label><span></span></div>
       <span class="lbl">${esc(t('len'))}</span>${chips(ED.len,sl.len,`data-ed="sl-set" data-id="${g.id}" data-ix="${i}"`)}
       ${(g.slots||[]).length>1?`<button type="button" class="link" data-ed="sl-rm" data-id="${g.id}" data-ix="${i}">${esc(t('slotRm'))}</button>`:''}
     </div>`).join('')+
    `<button type="button" class="btn ghost small" data-ed="sl-add" data-id="${g.id}">${esc(t('another'))}</button>

 time:['About 15 minutes, one short screen at a time, in as many sittings as you like. Everything is saved on this phone as you go. At the end you press Submit and Hossam receives your answers.','نحو 15 دقيقة، شاشة قصيرة في كل مرة، وعلى أي عدد من الجلسات. يُحفظ كل شيء على هذا الهاتف أولًا بأول. وفي النهاية تضغط «إرسال» فتصل إجاباتك إلى حسام.'],

function titleEn(){if(ACADEMY.fullName)return ACADEMY.fullName;const a=st.A.gname;return (a&&a.own&&a.own.trim())||SPT[CFG.sport][0]}

function costBox(){const c=D.costs||null;if(!c)return '';const rows=isAr()?c.ar:c.en;return `<div class="card"><p class="qq">${esc(L('Cost guide','دليل التكاليف'))}</p><div class="costs">${rows.map(r=>`<div class="cost"><b>${esc(r[0])}</b><span>${esc(r[1])}</span></div>`).join('')}</div><p class="hint" style="font-weight:500">${esc(isAr()?c.note_ar:c.note)}</p></div>`}
function renderSec(sid,opt){
  const s=secById(sid);
  let h=`<div class="stephead"><h2>${esc(stitle(s))}</h2><p class="why">${esc(swhy(s))}</p><p class="hint" style="font-weight:500">${esc(opt?t('optAt'):t('atLeast'))}</p></div>`;
  if(sid==='s2'){const gq=secQs('s2').find(q=>q.id==='groups');if(gq)h+=card(gq);h+=editorHTML();secQs(sid).filter(q=>q.id!=='groups').forEach(q=>h+=card(q));return h}
  if(sid==='o1')h+=costBox();

function optStatus(){const o={};OPT.forEach(id=>{const qs=QS.filter(q=>q.sec===id);o[id]={opened:!!st.opened[id],answered:qs.filter(q=>isAns(st.A[q.id])).length,total:qs.length}});return o}
function waCard(lead){const parts=waParts();const sent=st.sent||{};
  return `<div class="card" id="wacard"><p class="qq">${esc(t('sendWA'))}</p>${lead?`<p class="why">${esc(lead)}</p>`:''}`+
    (parts.length>1?`<p class="hint" style="font-weight:500">${esc(L(`Your answers are split into ${parts.length} messages. Tap each button in order and press send in Hossam’s chat each time.`,`قُسّمت إجاباتك إلى ${parts.length} رسائل. اضغط كل زر بالترتيب واضغط إرسال في محادثة حسام في كل مرة.`))}</p>`:'')+
    parts.map((p,i)=>`<a class="btn ${sent[i]?'ghost':''}" style="display:block" href="${esc('https://wa.me/'+WA_NUM+'?text='+encodeURIComponent(p))}" target="_blank" rel="noopener" data-part="${i}">${sent[i]?'✓ '+esc(t('opened'))+' · ':''}${esc(parts.length>1?L(`Send part ${i+1} of ${parts.length}`,`أرسل الجزء ${i+1} من ${parts.length}`):t('sendWA'))}</a>`).join('')+
    `<p class="hint" style="font-weight:500">${esc(t('waNote'))}</p>
    <button type="button" class="btn ghost" id="copyBtn">${esc(t('copy'))}</button><p class="ok" id="copied" hidden></p>
    <pre class="out" id="out" tabindex="0">${esc(outText())}</pre></div>`}
function naCount(){return CORE.reduce((n,id)=>n+missingNamed(id).length,0)}
function subCard(){
  if(!ENDPOINT)return waCard(t('noEp'));
  const n=naCount();let h='';
  if(st.submitted&&!st.subFail){
    h+=`<div class="card subok" id="subcard"><p class="qq">✓ ${esc(t('subOk').replace('{t}',fmtWhen(st.submitted)))}</p><p class="why">${esc(t('subEdit'))}</p>
      <button type="button" class="btn ghost" id="subBtn" ${st.submitting?'disabled':''}>${esc(st.submitting?t('submitting'):t('submitAgain'))}</button>
      <p class="why">${esc(t('subLogo'))}</p><a class="btn ghost" style="display:block" href="https://wa.me/${WA_NUM}" target="_blank" rel="noopener">${esc(t('subLogoBtn'))}</a></div>`;
    return h}
  h+=`<div class="card" id="subcard"><p class="qq">${esc(t('subT'))}</p><p class="why">${esc(t('subLead'))}</p>${n?`<p class="hint" style="font-weight:500">${esc(t('subNa').replace('{n}',n))}</p>`:''}
    ${st.subFail?`<div class="notice" style="background:var(--warn-soft)">${esc(t('subFail'))}</div>`:''}
    <button type="button" class="btn" id="subBtn" ${st.submitting?'disabled':''}>${esc(st.submitting?t('submitting'):t('submit'))}</button></div>`;
  if(st.subFail)h+=waCard('');
  return h}
function renderReview(){
  const S=steps();
  let h=`<div class="stephead"><h2>${esc(t('reviewTitle'))}</h2><p class="why">${esc(t('reviewLead'))}</p></div>`;
  h+=subCard();
  h+=`<div class="card"><p class="qq">${esc(t('keepT'))}</p><p class="why">${esc(t('profileHint'))}</p><button type="button" class="btn ghost" id="profBtn">${esc(t('profileBtn'))}</button></div>`;
  const na=CORE.map(id=>({id,i:S.findIndex(x=>x.id===id),items:missingNamed(id)})).filter(x=>x.items.length);
  if(na.length)h+=`<div class="card need" id="na"><p class="qq">${esc(t('naT'))} · ${na.reduce((n,x)=>n+x.items.length,0)}</p><p class="why">${esc(t('naLead'))}</p>`+na.map(x=>`<div class="optcard"><div><b>${esc(stitle(secById(x.id)))}</b><br>${x.items.map(it=>`<span class="hint" style="font-weight:500">· ${esc(it)}</span>`).join('<br>')}</div><button type="button" class="btn ghost small" data-go="${x.i}">${esc(t('go'))}</button></div>`).join('')+`</div>`;
  const dk=tagged('dk'),nd=tagged('nd');
  if(dk.length)h+=`<div class="card"><p class="qq">${esc(t('dkTitle'))} · ${dk.length}</p><p class="why">${esc(t('dkLead'))}</p>${dk.map(x=>`<p>· ${esc(x)}</p>`).join('')}</div>`;
  if(nd.length)h+=`<div class="card"><p class="qq">${esc(t('ndTitle'))} · ${nd.length}</p><p class="why">${esc(t('ndLead'))}</p>${nd.map(x=>`<p>· ${esc(x)}</p>`).join('')}</div>`;
  const os=optStatus();
  h+=`<div class="card"><p class="qq">${esc(t('optTitle'))}</p><p class="why">${esc(t('optLead'))}</p>`+OPT.map(id=>{const i=S.findIndex(x=>x.id===id);const o=os[id];
    return `<div class="optcard"><div><b>${esc(stitle(secById(id)))}</b><br><span class="hint">${esc(o.answered?t('answered').replace('{a}',o.answered):o.opened?t('opened'):t('notOpened'))}</span></div><button type="button" class="btn ghost small" data-go="${i}">${esc(t('open'))}</button></div>`}).join('')+`</div>`;
  h+=`<div class="rv">`;
  S.forEach((s,i)=>{if(s.k!=='sec'||s.opt)return;const sec=secById(s.id);
    h+=`<div class="rvsec"><div class="rvhead"><h3>${esc(stitle(sec))}</h3><button type="button" class="btn ghost small" data-go="${i}">${esc(t('edit'))}</button></div>`;
    if(s.id==='s2')h+=setupTable(false);
    h+=secQs(s.id).map(q=>`<div class="rvrow"><span class="q">${esc(qtitle(q))}</span><span class="${isAns(st.A[q.id])?'':'e'}">${esc(summary(q,st.A[q.id]))}</span></div>`).join('')+`</div>`});
  return h+`</div>`;
}
function setupTable(full){
  const S=st.S;let h='';
  if(S.wa)h+=`<p class="note">${esc(t('wa'))}</p>`;
  S.branches.forEach(b=>{const gs=G().filter(g=>g.b===b.id);
    h+=`<p><b>${esc(b.name)}</b></p>`;
    if(gs.length)h+=`<div class="tbl"><table><thead><tr><th>${esc(L('Group','المجموعة'))}</th><th>${esc(t('sg'))}</th><th>${esc(t('tP'))}</th><th>${esc(t('coaches'))}</th><th>${esc(t('when'))}</th>${full?`<th>${esc(t('perCoach'))}</th>`:''}</tr></thead><tbody>`+
      gs.map(g=>{const cs=(g.coaches||[]).map(cname).filter(Boolean);return `<tr><td>${esc(g.name||'')}</td><td>${esc(lab(ED.sgender,g.gender))}</td><td class="n">${esc(g.players||'')}</td><td>${esc(cs.join(', '))}</td><td>${esc((g.slots||[]).map(x=>slotLine(x)).filter(Boolean).join(' · '))}</td>${full?`<td class="n">${cs.length&&g.players?Math.round((+g.players)/cs.length):''}</td>`:''}</tr>`}).join('')+`</tbody></table></div>`;
  });
  if(S.coaches.length)h+=`<p><b>${esc(t('coT'))}</b></p><div class="tbl"><table><thead><tr><th>${esc(t('coName'))}</th><th>${esc(t('role'))}</th><th>${esc(L('Qualifications','المؤهلات'))}</th><th>${esc(L('Years','السنوات'))}</th>${full?`<th>${esc(t('groupsN'))}</th><th>${esc(t('sessW'))}</th><th>${esc(t('brs'))}</th>`:''}</tr></thead><tbody>`+
    totals().load.map(l=>`<tr><td>${esc(l.c.name)}</td><td>${esc(lab(ED.role,l.c.role))}</td><td>${esc((l.c.qual||[]).map(x=>lab(QUALS(),x)).join(', '))}</td><td>${esc(lab(ED.yrs,l.c.yrs))}</td>${full?`<td class="n">${l.groups}</td><td class="n">${l.sess}</td><td>${esc(l.br.join(', '))}</td>`:''}</tr>`).join('')+`</tbody></table></div>`;
  return h;
}
function tagged(v){const out=[];CORE.forEach(id=>secQs(id).forEach(q=>{if(((st.A[q.id]||{}).sel||[]).includes(v))out.push(qtitle(q))}));return out}

/* ---------- text output ---------- */
function enQ(q){return fillIn(q.en,false)}
function lineFor(q,a){const p=(a.sel||[]).map(v=>v==='nd'?T.nd[0]:v==='dk'?T.dk[0]:((q.opts||[]).find(x=>x[0]===v)||[0,v])[1]);if(a.own)p.push((q.type==='text'||q.type==='year'?'':'Own: ')+a.own);return `- ${enQ(q)}: ${fillIn(p.join('; '),false)}\n`}
const EL=(arr,id)=>{const o=arr.find(x=>x[0]===id);return o?o[1]:(id==='dk'?'I don’t know':'')};
function setupText(){
  const S=st.S;let s='';
  if(S.wa)s+='(Will send the timetable on WhatsApp)\n';
  S.branches.forEach(b=>{s+=`${b.name}\n`;
    G().filter(g=>g.b===b.id).forEach(g=>{const cs=(g.coaches||[]).map(cname).filter(Boolean);
      s+=`- ${g.name||'?'} · ${EL(ED.sgender,g.gender)} · ${g.players||'?'} ${PW.P} · ${cs.join(', ')} · ${(g.slots||[]).map(x=>slotLine(x,true)).filter(Boolean).join('; ')}\n`})});
  if(S.coaches.length){s+='Coaches:\n';S.coaches.forEach(c=>s+=`- ${c.name} (${[EL(ED.role,c.role),(c.qual||[]).map(x=>EL(QUALS(),x)).join(', '),EL(ED.yrs,c.yrs)].filter(Boolean).join('; ')})\n`)}
  const tt=totals();if(G().length)s+=`Totals: ${tt.players} ${PW.P}, ${G().length} groups, ${tt.sessW} sessions a week, ${S.branches.length} branches, ${S.coaches.length} coaches\n`;
  return s;
}
function setupTextL(){
  const S=st.S;let s='';
  if(S.wa)s+=t('wa')+'\n';
  S.branches.forEach(b=>{s+=`${b.name}\n`;
    G().filter(g=>g.b===b.id).forEach(g=>s+=`- ${groupLine(g)}\n`)});
  if(S.coaches.length){s+=t('coT')+':\n';S.coaches.forEach(c=>s+=`- ${coachLine(c)}\n`)}
  const tt=totals();if(G().length)s+=L(`Totals: ${tt.players} ${PW.P}, ${G().length} groups, ${tt.sessW} sessions a week, ${S.branches.length} branches, ${S.coaches.length} coaches`,`المجموع: ${tt.players} لاعبًا، ${G().length} مجموعات، ${tt.sessW} حصة أسبوعيًا، ${S.branches.length} فروع، ${S.coaches.length} مدرّبين`)+'\n';
  return s;
}
function readable(){
  let s=`HOST · ${titleNow()}\n`;
  [...CORE,...OPT].forEach(id=>{const sec=secById(id);const qs=secQs(id).filter(q=>isAns(st.A[q.id]));const isOpt=OPT.includes(id);
    if(id==='s2'){s+=`\n*${stitle(sec)}*\n`+setupTextL();qs.forEach(q=>s+=`- ${qtitle(q)}: ${summary(q,st.A[q.id])}\n`);return}
    if(!qs.length)return;s+=`\n*${stitle(sec)}${isOpt?' ('+t('optional')+')':''}*\n`;qs.forEach(q=>s+=`- ${qtitle(q)}: ${summary(q,st.A[q.id])}\n`)});
  const dk=tagged('dk'),nd=tagged('nd');
  if(dk.length)s+=`\n*${t('dkTitle')} (${dk.length})*\n`+dk.map(x=>'- '+x+'\n').join('');
  if(nd.length)s+=`\n*${t('ndTitle')} (${nd.length})*\n`+nd.map(x=>'- '+x+'\n').join('');
  const na=[];CORE.forEach(id=>missingNamed(id).forEach(x=>na.push(stitle(secById(id))+': '+x)));
  if(na.length)s+=`\n*${t('naT')} (${na.length})*\n`+na.map(x=>'- '+x+'\n').join('');
  const os=optStatus();s+=`\n${L('Optional sections','الأقسام الاختيارية')}: `+OPT.map(id=>`${stitle(secById(id))} ${os[id].answered?t('answered').replace('{a}',os[id].answered):os[id].opened?t('opened'):t('notOpened')}`).join(' · ')+'\n';
  return s;
}
function pack(A){const o={};Object.keys(A).forEach(k=>{const a=A[k];if(!isAns(a))return;o[k]=[(a.sel||[]).join(','),a.own||''];if(!o[k][1])o[k].length=1});return o}
function code(){const S=st.S;const c={s:SPORT,l:st.lang,A:pack(st.A),B:S.branches.map(b=>[b.id,b.name]),C:S.coaches.map(x=>[x.id,x.name,x.role||'',(x.qual||[]).join(','),x.yrs||'']),

    if(q.type==='single'){a.sel=a.sel[0]===v?[]:[v]}
    else{const k=a.sel.indexOf(v);if(k>=0)a.sel.splice(k,1);else{if(EXCL.has(v))a.sel=[];else a.sel=a.sel.filter(x=>!EXCL.has(x));if(q.max&&a.sel.length>=q.max){toast(t('maxMsg').replace('{n}',q.max));return}a.sel.push(v)}}
    if(EXCL.has(v)&&a.sel.includes(v)){a.own='';a.ownOn=false}
    keep();return}
});
function edClick(el){
  const S=st.S,ui=UI(),id=el.dataset.id,f=el.dataset.f,v=el.dataset.val,act=el.dataset.ed,ix=+el.dataset.ix;
  const fg=x=>G().find(g=>g.id===x);
  if(act==='wa'){S.wa=!S.wa;keep();return}
  if(act==='open'){ui[el.dataset.k]=id;keep();const r=document.getElementById((el.dataset.k==='co'?'co-':'gr-')+id);if(r)r.scrollIntoView({block:'nearest'});return}
  if(act==='done'){ui[el.dataset.k]=null;keep();return}
  if(act==='br-add'){const b={id:uid('b'),name:''};S.branches.push(b);keep();focusEd('bn-'+b.id);return}
  if(act==='co-add'){const c={id:uid('c'),name:'',qual:[]};S.coaches.push(c);ui.co=c.id;keep();focusEd('cn-'+c.id);return}
  if(act==='gr-add'){const g={id:uid('g'),b:id,name:'',coaches:[],slots:[{days:[]}]};G().push(g);ui.gr=g.id;keep();focusEd('gn-'+g.id);return}
  if(act==='br-rm'||act==='co-rm'||act==='gr-rm'){if(el.dataset.sure!=='1'){el.dataset.sure='1';el.textContent=t('removeSure');setTimeout(()=>{if(el.isConnected){el.dataset.sure='';el.textContent=t('remove')}},4000);return}
    if(act==='br-rm'){S.branches=S.branches.filter(x=>x.id!==id);S.groups=G().filter(g=>g.b!==id)}
    if(act==='co-rm'){S.coaches=S.coaches.filter(x=>x.id!==id);G().forEach(g=>g.coaches=(g.coaches||[]).filter(c=>c!==id));ui.co=null}
    if(act==='gr-rm'){S.groups=G().filter(g=>g.id!==id);ui.gr=null}
    keep();return}
  if(act==='co-set'){const c=findC(id);c[f]=c[f]===v?'':v;keep();return}
  if(act==='co-tog'){const c=findC(id);c[f]=c[f]||[];const k=c[f].indexOf(v);k>=0?c[f].splice(k,1):c[f].push(v);keep();return}
  if(act==='gr-set'){const g=fg(id);g[f]=g[f]===v?'':v;keep();return}
  if(act==='gr-tog'){const g=fg(id);g[f]=g[f]||[];const k=g[f].indexOf(v);k>=0?g[f].splice(k,1):g[f].push(v);keep();return}
  if(act==='sl-add'){fg(id).slots.push({days:[]});keep();return}
  if(act==='sl-rm'){fg(id).slots.splice(ix,1);keep();return}
  if(act==='sl-tog'){const g=fg(id);const sl=g.slots[ix];sl.days=sl.days||[];const k=sl.days.indexOf(v);
    if(k<0&&sl.time&&g.slots.some((o,j)=>j!==ix&&o.time===sl.time&&(o.days||[]).includes(v))){toast(t('dupDay').replace('{d}',lab(ED.days,v)).replace('{t}',sl.time));return}
    k>=0?sl.days.splice(k,1):sl.days.push(v);keep();return}
  if(act==='sl-set'){const sl=fg(id).slots[ix];sl.len=sl.len===v?'':v;keep();return}
  if(act==='gr-copy'){const g=fg(id);const n=JSON.parse(JSON.stringify(g));n.id=uid('g');n.b=el.dataset.to;n.players='';n.coaches=[];G().push(n);ui.gr=null;keep();
    toast(L('Copied to ','نُسخت إلى ')+((S.branches.find(b=>b.id===n.b)||{}).name||'')+L('. Add its players and coaches there.','. أضف هناك عدد اللاعبين والمدرّبين.'));return}
}
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset&&el.dataset.edin){const id=el.dataset.id,ix=+el.dataset.ix;const fg=x=>G().find(g=>g.id===x);
    if(el.dataset.edin==='br-name')findB(id).name=el.value;
    if(el.dataset.edin==='co-name')findC(id).name=el.value;
    if(el.dataset.edin==='gr-name')fg(id).name=el.value;
    if(el.dataset.edin==='gr-players')fg(id).players=el.value;
    if(el.dataset.edin==='sl-time')fg(id).slots[ix].time=el.value;
    save();const sm=document.getElementById('ed-sum');if(sm){const tmp=document.createElement('div');tmp.innerHTML=sumHTML();if(tmp.firstElementChild)sm.replaceWith(tmp.firstElementChild)}return}
  if(!el.classList||!el.classList.contains('txt'))return;
  const id=el.dataset.q,q=QS.find(x=>x.id===id);const a=st.A[id]=st.A[id]||{sel:[],own:''};a.own=el.value;a.ownOn=true;
  if(el.value.trim())a.sel=(a.sel||[]).filter(x=>!EXCL.has(x));save();
  const c=document.getElementById('c-'+id);if(c)c.classList.toggle('done',isAns(a));
  if(id==='gname')document.getElementById('brand').textContent=titleNow();
  if(q&&q.type==='year'){const b=c&&c.querySelector('button[data-v="dk"]');if(b)b.setAttribute('aria-pressed','false')}
});
function focusEd(id){const el=document.getElementById(id);if(el){el.focus({preventScroll:true});el.scrollIntoView({block:'center'})}}
// a time changed so that a day now repeats another time of the same group: take the day off this time
document.addEventListener('change',e=>{const el=e.target;if(!el.dataset||el.dataset.edin!=='sl-time')return;const g=G().find(x=>x.id===el.dataset.id);if(!g)return;const ix=+el.dataset.ix;const sl=g.slots[ix];if(!sl||!sl.time)return;
  const dup=(sl.days||[]).filter(d=>g.slots.some((o,j)=>j!==ix&&o.time===sl.time&&(o.days||[]).includes(d)));
  if(dup.length){sl.days=sl.days.filter(d=>!dup.includes(d));keep();toast(t('dupRemoved').replace('{d}',dup.map(d=>lab(ED.days,d)).join(', ')).replace('{t}',sl.time))}});
function openMenu(){const S=steps();const m=document.getElementById('menu');const r=reviewIdx();
  m.innerHTML=`<div class="sheet" role="dialog" aria-label="${esc(t('menu'))}">`+S.map((s,i)=>{if(s.k==='welcome')return '';const title=s.k==='review'?t('review'):stitle(secById(s.id))+(s.opt?' · '+t('optional'):'');
    const nl=s.k==='sec'&&!s.opt?missingNamed(s.id).length:0;const c=s.k==='sec'&&!s.opt?(nl?t('leftN').replace('{n}',nl):'✓'):'';return `<button type="button" class="step ${i===st.step?'cur':''}" data-go="${i}"><span>${s.opt?'':i+'. '}${esc(title)}</span><span class="n">${c}</span></button>`}).join('')+`</div>`;
  m.hidden=false;m.onclick=ev=>{if(ev.target===m||ev.target.closest('[data-go]'))m.hidden=true}}
function copyOut(){const txt=outText();const msg=document.getElementById('copied');
  const ok=()=>{if(msg){msg.textContent=t('copied');msg.hidden=false}else toast(t('copied'))};
  const fail=()=>{selOut();if(msg){msg.textContent=t('copyFail');msg.hidden=false}else toast(t('copyFail'))};
  try{navigator.clipboard.writeText(txt).then(ok,()=>{try{selOut();document.execCommand('copy')?ok():fail()}catch(e){fail()}})}catch(e){fail()}}
function selOut(){const o=document.getElementById('out');if(!o)return;const r=document.createRange();r.selectNodeContents(o);const s=getSelection();s.removeAllRanges();s.addRange(r)}
let toastT=null;
function toast(msg){let el=document.getElementById('toast');if(!el){el=document.createElement('div');el.id='toast';el.className='notice';el.setAttribute('role','status');el.style.cssText='position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);z-index:30;max-width:688px;margin:0 auto;box-shadow:0 4px 18px rgba(0,0,0,.18)';document.body.appendChild(el)}el.textContent=msg;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,3500)}
render();
if(!VIEW&&st.started&&st.step>0)setTimeout(()=>toast('✓ '+t('cont')),300);
</script>
