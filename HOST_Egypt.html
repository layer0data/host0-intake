<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>HOST Egypt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@600;700&display=swap">
<style>
/* HOST Egypt: one page app. Top bar, a side menu on wide screens and a bottom menu on phones, cards in the middle. HOST blue from the logo; orange only for things that need attention. */
:root{
  --bg:#F3F5F8;--surface:#FFFFFF;--sunk:#E9EEF4;--ink:#14202C;--muted:#56636F;--line:#D3DBE4;
  --accent:#2F6FAE;--accent-ink:#FFFFFF;--accent-soft:#DFEAF5;--flame:#C4541A;--flame-soft:#FBE7DA;--ok:#1F7A4D;--ok-soft:#DDF1E6;--warn:#9A6B06;--warn-soft:#FBF0D6;
  --display:"IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif;--body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--arabic:"IBM Plex Sans Arabic","Geeza Pro",Tahoma,sans-serif;
  color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0F151C;--surface:#18212B;--sunk:#111922;--ink:#E6EDF4;--muted:#9AA8B6;--line:#2A3643;--accent:#7DB2E4;--accent-ink:#0F151C;--accent-soft:#1A2F44;--flame:#F08A52;--flame-soft:#3A2416;--ok:#62C894;--ok-soft:#173226;--warn:#E8B44A;--warn-soft:#3A2E12;color-scheme:dark}}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);-webkit-text-size-adjust:100%}
body.rtl{font-family:var(--arabic)}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15;text-wrap:balance}
body.rtl h1,body.rtl h2,body.rtl h3{font-family:var(--arabic)}
h1{font-size:26px}h2{font-size:20px}h3{font-size:16px}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 8px) 14px 8px;display:flex;align-items:center;gap:10px}
.top img{height:28px;width:auto}
.top .ttl{font:700 15px var(--display);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
body.rtl .top .ttl{font-family:var(--arabic)}
@media(max-width:430px){.top .ttl{visibility:hidden}}
.lang{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.lang button{border:0;background:var(--surface);padding:5px 9px;font-size:13px;font-weight:600;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.who{font-size:12px;color:var(--muted);white-space:nowrap}
.layout{display:grid;grid-template-columns:1fr;max-width:1200px;margin:0 auto}
@media (min-width:900px){.layout{grid-template-columns:210px 1fr}}
nav.side{display:none}
@media (min-width:900px){nav.side{display:flex;flex-direction:column;gap:4px;padding:16px 10px;position:sticky;top:52px;align-self:start}}
nav.side button,nav.bottom button{border:0;background:none;cursor:pointer;color:var(--muted);font-weight:600}
nav.side button{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;text-align:start}
nav.side button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(env(safe-area-inset-bottom,0px) + 6px)}
@media (min-width:900px){nav.bottom{display:none}}
nav.bottom button{display:grid;justify-items:center;gap:2px;font-size:11px;padding:4px 6px;min-width:56px}
nav.bottom button[aria-current="page"]{color:var(--accent)}
.ic{width:20px;height:20px;display:inline-block}
main{padding:16px 14px 100px;display:grid;gap:14px;min-width:0}
@media (min-width:900px){main{padding:20px 20px 40px}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:10px;min-width:0}
.card.attn{border-color:var(--flame);box-shadow:0 0 0 2px var(--flame-soft)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.sp{justify-content:space-between}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:2px}
.kpi b{font:700 26px var(--display);font-variant-numeric:tabular-nums}
.kpi span{font-size:12.5px;color:var(--muted);font-weight:600}
.kpi.attn b{color:var(--flame)}
.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--accent);color:var(--accent-ink);font-weight:600;cursor:pointer;min-height:42px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{min-height:34px;padding:6px 10px;font-size:13px}
.btn.wa{background:#1F7A4D;color:#fff}
.btn.warn{background:var(--flame);color:#fff}
.btn[disabled]{opacity:.55;cursor:default}
.link{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;font-weight:600;text-decoration:underline}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.tag{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;background:var(--sunk);color:var(--muted);white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:var(--ok)}.tag.attn{background:var(--flame-soft);color:var(--flame)}.tag.info{background:var(--accent-soft);color:var(--accent)}.tag.warn{background:var(--warn-soft);color:var(--warn)}
.list{display:grid;gap:0}
.item{display:flex;gap:10px;align-items:center;padding:11px 2px;border-top:1px solid var(--line);cursor:pointer;min-width:0}
.item:first-child{border-top:0}
.item .nm{font-weight:600}
.item .sub{font-size:12.5px;color:var(--muted)}
.av{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;flex:0 0 auto}
label.f{display:grid;gap:5px;font-size:13px;font-weight:600;min-width:0}
input.in,select.in,textarea.in{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:9px 10px;width:100%;min-width:0}
textarea.in{min-height:80px;resize:vertical}
input.in:focus,select.in:focus,textarea.in:focus{outline:2px solid var(--accent);outline-offset:1px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-weight:600;font-size:13.5px;white-space:nowrap;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:8px 9px;text-align:start;border-top:1px solid var(--line);vertical-align:middle;white-space:nowrap}
th{background:var(--sunk);font-size:12px;color:var(--muted);border-top:0;position:sticky;top:0}
td.n,th.n{text-align:end;font-variant-numeric:tabular-nums}
.bars{display:grid;gap:6px}
.bar{display:grid;grid-template-columns:minmax(90px,150px) 1fr 44px;gap:8px;align-items:center;font-size:13px}
.bar .tr{height:10px;background:var(--sunk);border-radius:6px;overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--accent);border-radius:6px}
.bar .tr i.alt{background:var(--flame)}
.bar .v{text-align:end;font-variant-numeric:tabular-nums;font-weight:600}
.cols{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(180px,1fr);gap:10px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--sunk);border-radius:12px;padding:10px;display:grid;gap:8px;align-content:start;min-height:120px}
.col h3{font-size:13px;display:flex;justify-content:space-between}
.lead{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:3px;cursor:pointer;font-size:13.5px}
.lead.due{border-color:var(--flame)}
.score{display:flex;gap:4px}
.score button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer}
.score button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.score button.clr{width:auto;padding:0 8px;font-weight:600;font-size:12px;color:var(--muted)}
select.sc{width:54px;padding:5px;border:1px solid var(--line);border-radius:7px;background:var(--surface);text-align:center;font-weight:700}
select.sc.set{background:var(--accent-soft);border-color:var(--accent)}
.pl{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.pl:first-child{border-top:0;padding-top:0}
.skr{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.att{display:flex;gap:4px}
.att button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-weight:600;font-size:13px;cursor:pointer}
.att button[aria-pressed="true"].y{background:var(--ok);color:#fff;border-color:var(--ok)}
.att button[aria-pressed="true"].n{background:var(--flame);color:#fff;border-color:var(--flame)}
.att button[aria-pressed="true"].l{background:var(--warn);color:#fff;border-color:var(--warn)}
.att button[aria-pressed="true"].e{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.row.wrap{flex-wrap:wrap}
/* levels: four steps of one blue, never red (L1 is a starting point, not a failure) */
:root{--l1:#E3EDF7;--l1i:#24496E;--l2:#BCD3EC;--l2i:#1C3E60;--l3:#6C9FD3;--l3i:#FFFFFF;--l4:#2F6FAE;--l4i:#FFFFFF}
@media (prefers-color-scheme:dark){:root{--l1:#1C2B3A;--l1i:#BFD6EE;--l2:#284766;--l2i:#DCEAF7;--l3:#3E6D9E;--l3i:#FFFFFF;--l4:#6FA5DC;--l4i:#0F151C}}
.lv{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:700;white-space:nowrap}
.lv i{font-style:normal;letter-spacing:1px;font-size:10px}
.lv0{background:var(--sunk);color:var(--muted)}.lv1{background:var(--l1);color:var(--l1i)}.lv2{background:var(--l2);color:var(--l2i)}.lv3{background:var(--l3);color:var(--l3i)}.lv4{background:var(--l4);color:var(--l4i)}
.lv.soft{background:transparent;box-shadow:inset 0 0 0 1.5px currentColor;color:var(--accent)}
.lvn{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;flex:0 0 auto}
.dev{display:grid;gap:4px;border-top:1px solid var(--line);padding-top:10px}
.dev:first-of-type{border-top:0}
.dev h3{font-size:15px}
details.dev summary{cursor:pointer;list-style:revert}
.drow{display:flex;gap:10px;align-items:center;padding:7px 0;border-top:1px dashed var(--line);min-width:0}
.drow:first-of-type{border-top:0}
.drow .sub{font-size:12.5px;color:var(--muted)}
.tright{text-align:end;display:grid;justify-items:end;gap:2px}
.plan{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:8px;background:var(--bg)}
ol.blocks{margin:0;padding-inline-start:20px;display:grid;gap:8px}
ol.blocks li{padding-inline-start:4px}
.choice{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.choice button{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 11px;font-weight:600;font-size:13px;cursor:pointer;min-height:40px}
.choice button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pl.deep{background:linear-gradient(var(--accent-soft),var(--accent-soft)) left top/4px 100% no-repeat;padding-inline-start:10px}
body.rtl .pl.deep{background-position:right top}
.evrow{display:grid;gap:6px;padding:6px 0;border-top:1px dashed var(--line)}
.evbtns{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
@media (max-width:600px){.evbtns{grid-template-columns:repeat(2,minmax(0,1fr))}.evbtns .no{grid-column:1/-1}}
.evbtns button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px;font-size:12.5px;font-weight:600;cursor:pointer;display:grid;gap:3px;text-align:start;min-height:44px;align-content:start}
.evbtns button span{font-weight:400;font-size:11.5px;color:var(--muted);line-height:1.35}
.evbtns button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.compact .evbtns{grid-template-columns:repeat(5,minmax(0,1fr))}.compact .evbtns .no{grid-column:auto}.compact .evbtns{gap:4px}.compact .evbtns button{padding:6px 1px;font-size:11px;text-align:center;justify-items:center;word-break:keep-all;overflow-wrap:normal;letter-spacing:-.2px}@media (max-width:420px){.compact .evbtns button{font-size:9.5px}}
.compact .evbtns button b{font-size:15px}
details.pl>summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:4px 0}details.pl>summary::-webkit-details-marker{display:none}details.pl>summary::before{content:'▸';color:var(--muted)}details.pl[open]>summary::before{content:'▾'}
.evbtns button[aria-pressed="true"] span{color:var(--accent-ink);opacity:.9}
.evbtns button.no{color:var(--muted)}
.evbtns button.no[aria-pressed="true"]{color:var(--accent-ink)}
.kpi.txt b{font:600 15px/1.35 var(--body)}body.rtl .kpi.txt b{font-family:var(--arabic)}
table.board td{text-align:center;font-weight:700;padding:6px 4px;min-width:28px}
table.board td:first-child{text-align:start}
table.board td.c0{color:var(--muted)}table.board td.c1{background:var(--l1);color:var(--l1i)}table.board td.c2{background:var(--l2);color:var(--l2i)}table.board td.c3{background:var(--l3);color:var(--l3i)}table.board td.c4{background:var(--l4);color:var(--l4i)}
table.board td.soft{opacity:.6}
.kid{max-width:560px;margin:0 auto;padding:16px;display:grid;gap:14px}
.kid h1{font-size:34px}
.big{font-size:20px;font-weight:600}
.faces{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 12px}
.faces label{cursor:pointer}.faces input{position:absolute;opacity:0}
.faces span{display:inline-grid;place-items:center;min-width:64px;min-height:56px;padding:6px 12px;border:2px solid var(--line);border-radius:14px;font-size:22px;font-weight:700;background:var(--surface)}
.faces input:checked+span{border-color:var(--accent);background:var(--accent-soft)}
.faces input:focus-visible+span{outline:2px solid var(--accent)}
.report{display:grid;gap:8px}
.report h3{margin-top:6px}
ul{margin:0;padding-inline-start:20px}
@media print{body{background:#fff}.modal{position:static;background:none}.sheet{max-height:none;box-shadow:none}body:has(#modal .modal) #app{display:none}}
.notice{border-radius:10px;padding:10px 12px;background:var(--accent-soft);font-size:14px}
.notice.attn{background:var(--flame-soft)}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,16,24,.45);display:grid;place-items:end center}
@media (min-width:700px){.modal{place-items:center}}
.sheet{background:var(--surface);width:min(640px,100%);max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 18px);display:grid;gap:12px}
@media (min-width:700px){.sheet{border-radius:16px}}
#toast{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 74px);z-index:60;max-width:520px;margin:0 auto;background:var(--ink);color:var(--surface);border-radius:12px;padding:11px 14px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.login{max-width:420px;margin:8vh auto;padding:0 16px;display:grid;gap:14px}
.login img{height:60px;justify-self:start}
.pre{white-space:pre-wrap;background:var(--sunk);border-radius:10px;padding:12px;font-size:14px}
.saving{font-size:12px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--flame)}
@media print{.top,nav,.noprint{display:none!important}main{padding:0}.card{border:0}}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<script src="host-egypt-settings.js"></script>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast" hidden role="status"></div>
<script>

/* seasons and the schedule */
function seasonOn(dateStr) { return (SET().seasons || []).find(s => s.from <= dateStr && dateStr <= s.to) || null }
function slotsOn(dateStr) { const s = seasonOn(dateStr); if (!s) return []; const d = parseD(dateStr).getDay(); return (s.slots || []).filter(x => +x.day === d) }
function closedOn(dateStr) { return (SET().closed || []).find(c => c.date === dateStr) || null }
function upcoming(n, from) {
  const out = []; let d = from || todayStr(); const done = D().sessions || [];
  for (let i = 0; i < 200 && out.length < n; i++) {
    slotsOn(d).forEach(sl => { const rec = done.find(s => s.date === d && (s.start || '') === sl.start); out.push({ date: d, start: sl.start, end: sl.end, rec, closed: closedOn(d) }) });
    d = addDays(d, 1);
  }
  return out;
}

/* ---------- api ---------- */
async function api(a, body) {
  if (!ENDPOINT) throw new Error(L('The app is not connected to its Google Sheet yet (host-egypt-settings.js).', 'التطبيق غير متصل بجدول جوجل بعد (host-egypt-settings.js).'));
  const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), 45000);
  try {
    const r = await fetch(ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ a, t: S.t }, body || {})), signal: ctl.signal });
    const j = await r.json();
    if (!j.ok && j.error === 'login') { logout(true); throw new Error(L('Please log in again.', 'سجّل الدخول مرة أخرى.')) }
    if (!j.ok) throw new Error(j.error || 'error');
    return j;
  } finally { clearTimeout(tm) }
}
async function load() { const j = await api('load'); S.D = j; S.me = j.me; return j }
async function reload() { try { await load(); rerender() } catch (e) { toast('⚠ ' + e.message) } }
function busy(n) { S.saving += n; const el = $('#saving'); if (el) el.textContent = S.saving > 0 ? L('Saving…', 'جارٍ الحفظ…') : '' }
async function save(kind, rec, quiet) {
  busy(1);
  try { const j = await api('save', { kind, rec }); upsertLocal(kind, j.rec); if (!quiet) toast('✓ ' + w('saved')); return j.rec }
  catch (e) { toast('⚠ ' + e.message); throw e }
  finally { busy(-1) }
}
async function saveMany(kind, recs, quiet) {
  if (!recs.length) return [];
  busy(1);
  try { const j = await api('bulk', { kind, recs }); (j.recs || []).forEach(r => upsertLocal(kind, r)); if (!quiet) toast('✓ ' + w('saved')); return j.recs }
  catch (e) { toast('⚠ ' + e.message); throw e }
  finally { busy(-1) }
}
async function act(a, body, quiet) {
  busy(1);
  try { const j = await api(a, body); if (!quiet) toast('✓ ' + w('saved')); return j }
  catch (e) { toast('⚠ ' + e.message); throw e }
  finally { busy(-1) }
}

  const canCrit = !!(skills()[0] || {}).crit;
  const rows = cats().map(c => {
    const list = subsOf(c.id).filter(k => st(p.id, k.id) || op.indexOf(k.id) >= 0); if (!list.length) return '';

  }).join('');
  const chr = charDims().map(c => { const x = st(p.id, 'C' + c.id); return `<div class="drow"><div class="grow"><button class="link" ${c.anchor ? `data-act="criteria" data-v="C${c.id}"` : 'disabled'} style="text-decoration:none;color:var(--ink)">${esc(L(c.en, c.ar))}</button><div class="sub">${esc(L(c.spine_en, c.spine_ar))} · ${L('families read a description, never a grade', 'تقرأ العائلة وصفًا لا درجة')}</div></div><div class="tright">${stateChip(p.id, 'C' + c.id)}</div></div>` }).join('');
  const leg = legacyBox(p);

/* a session's focus is one or two categories: the coach teaches and rates them; the evaluators rate the sub-skills inside them that are open for each child */
const catsOf = s => { const p = planOf(s.id); return (p && Array.isArray(p.cats) && p.cats.length) ? p.cats.map(String) : (s.kind === 'competition' ? ['1', '10'] : ((D().plan || {}).cats || [])) };

/* the sub-skills an evaluator rates for one child in one session: open along the chain, in the session's categories; game skills only in a scrimmage */
const subsFor = (pid, s) => { const op = openOf(pid); const sc = isScrim(s); return catsOf(s).reduce((a, c) => a.concat(subsOf(c).filter(k => op.indexOf(k.id) >= 0 && (k.ctx !== 'scrimmage' || sc))), []) };

function sessionRoster(s) {

/* ---------- coach rating, like any academy's coach: one level per broad skill for the children who came, and what he noticed ---------- */
const coachWay = () => SET().coach_way || 'level';

  else rating = `<p class="small muted">${way === 'level_part' ? L('For each child: the level you saw today in each area, and which part was harder. About three minutes.', 'لكل طفل: المستوى الذي رأيته اليوم في كل مجال، وأي جزء كان أصعب. حوالي ثلاث دقائق.') : L('For each child: the level you saw today in each area. About two minutes.', 'لكل طفل: المستوى الذي رأيته اليوم في كل مجال. حوالي دقيقتين.')} ${L('Not seen is fine.', '«لم أرَ» مقبولة.')}</p>
    <p class="tiny muted">${[1, 2, 3, 4].map(k => `<b>${levelName(k)}</b>: ${esc(levelPlain(k))}`).join(' · ')}</p>

      return `<div class="evrow"><span class="small" style="font-weight:600">${esc(catName(c))}</span><div class="evbtns">${[1, 2, 3, 4].map(k => `<button type="button" data-act="crate" data-sid="${s.id}" data-pid="${p.id}" data-c="${c}" data-v="${k}" aria-pressed="${v === k}"><b>${k}</b> ${esc(levelName(k))}</button>`).join('')}<button type="button" class="no" data-act="crate" data-sid="${s.id}" data-pid="${p.id}" data-c="${c}" data-v="NO" aria-pressed="${v === 'NO'}">– ${L('Not seen', 'لم أرَ')}</button></div>

const EVQ = { items: {}, t: null, sid: '' };
function queueEv(sid, pid, k, v, note) {

  EVQ.items[key] = { player_id: pid, skill: k, level: v === undefined ? prev.level : v, note: note === undefined ? prev.note : note };
  const local = { id: 'local_' + sid + key, session_id: sid, player_id: pid, skill: k, level: v === 'NO' ? '' : v, state: v === 'NO' ? 'not_observed' : 'observed', source: 'evaluator', rater: S.me.id, rater_name: S.me.name, note: EVQ.items[key].note || '', at: new Date().toISOString() };

async function flushEv() {

}

function avgMonthsStayed() {
  const ps = players().filter(p => p.join_date); if (!ps.length) return 6;
  const m = ps.map(p => { const a = parseD(p.join_date), b = parseD(p.left_date || todayStr()); return Math.max(1, (b - a) / (30.4 * 864e5)) });
  return Math.max(1, Math.round(m.reduce((x, y) => x + y, 0) / m.length));
}

function retentionTab() {

  const activeIn = mk => players().filter(p => p.join_date && monthKey(p.join_date) <= mk && (!p.left_date || monthKey(p.left_date) > mk) && !(p.status === 'left' && !p.left_date && mk >= monthKey(t))).length;
  const attIn = mk => { const ses = sessionsDone().filter(s => monthKey(s.date) === mk); const rows = ses.reduce((a, s) => a.concat(attOf(s.id).filter(x => x.status !== 'excused')), []); return rows.length ? rows.filter(isHere).length / rows.length : null };
  const mx = Math.max(1, ...months.map(activeIn));
  const risk = activeP().map(p => { const l = lastSessionsFor(p.id, 6).filter(x => x.a.status !== 'excused'); const here = l.filter(x => isHere(x.a)).length; const r = []; if (missedRecent(p.id)) r.push(L('missed the last 2', 'غاب آخر حصتين')); else if (l.length >= 4 && here / l.length < .5) r.push(L(`came to ${here} of last ${l.length}`, `حضر ${here} من آخر ${l.length}`)); return r.length ? { p, r } : null }).filter(Boolean);
  const refs = {}; players().forEach(p => { if (p.referred_by) refs[p.referred_by] = (refs[p.referred_by] || 0) + 1 }); leads().forEach(l => { if (l.referred_by && l.stage !== 'registered') refs[l.referred_by] = (refs[l.referred_by] || 0) + 0 });
  const back = players().filter(p => p.status === 'left' || p.status === 'paused').map(p => ({ name: p.name, phone: p.parent_phone, pid: p.id })).concat(leads().filter(l => l.stage === 'past' || l.stage === 'lost').map(l => ({ name: l.child_name, phone: l.phone, lid: l.id, past: true })));

  <div class="card"><h2>${L('Families who bring others', 'عائلات تجلب غيرها')}</h2><div class="list">${Object.keys(refs).filter(k => refs[k]).sort((a, b) => refs[b] - refs[a]).map(k => `<div class="item" style="cursor:default"><div class="grow">${esc((P(k) || {}).name || k)}</div><span class="tag ok">${refs[k]}</span><button class="btn small ghost" data-act="compose" data-tpl="thanks_referral" data-pid="${k}">${L('Thank', 'اشكر')}</button></div>`).join('') || `<p class="empty">${L('Record “Referred by” on players and leads to see your ambassadors.', 'سجّل «رشّحه» للاعبين والعملاء لترى سفراءك.')}</p>`}</div>

    case 'evd': { const dr = S.evDraft; const i = dr.deep.indexOf(d.v); if (i >= 0) dr.deep.splice(i, 1); else dr.deep.push(d.v); el.setAttribute('aria-pressed', i < 0); break }
    case 'evplan-save': { const dr = S.evDraft; if (!dr.cats.length) { toast(L('Choose at least one focus area.', 'اختر مجال تركيز واحدًا على الأقل.')); break } const old = planOf(d.sid) || {}; const rec = Object.assign({}, old, { id: 'ep_' + d.sid, session_id: d.sid, cats: dr.cats.filter(c => dr.scrim || +c < 10), scrim: dr.scrim ? 'yes' : '', focus: [], deep: dr.deep, set_by: old.set_by || S.me.name, done: old.done || [] }); if (!rec.cats.length) { toast(L('Game areas need a scrimmage.', 'مجالات اللعب تحتاج مباراة تدريبية.')); break } await save('evalplans', rec, true); S.evDraft = null; S.evStep = 'record'; rerender(); break }
    case 'ev': { S.evOpen = d.pid; queueEv(d.sid, d.pid, d.k, d.v === 'NO' ? 'NO' : +d.v); el.parentNode.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === d.v)); break }
    case 'evsubmit': { await flushEv(); try { const j = await act('evsubmit', { session_id: d.sid }); upsertLocal('evalplans', j.plan); S.evStep = 'verify'; await load(); rerender() } catch (e) { } break }
    case 'crate': { queueRate(d.sid, d.pid, d.c, d.v === 'NO' ? 'NO' : +d.v); el.parentNode.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === d.v)); break }
    case 'cpart': { const o = myRate(d.sid, d.pid, d.c); if (!o || o.state !== 'observed') { toast(L('Tap a level first.', 'اختر مستوى أولًا.')); break } queueRate(d.sid, d.pid, d.c, +o.level, o.part === d.v ? '' : d.v); el.parentNode.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === d.v && o.part !== d.v)); break }
    case 'board-cat': S.boardCat = d.v; rerender(); break;
    case 'lc': try { const j = await act('levelcall', { rec: { player_id: d.pid, skill: d.k, cycle_k: +d.ck, cycle_end: d.end, status: d.v } }); upsertLocal('levelcalls', j.rec); await reload() } catch (e) { } break;
    case 'engine': try { const j = await act('engine', {}, true); toast('✓ ' + L(`${j.report.generated} new proposal(s), ${j.report.closed.moved + j.report.closed.stable + j.report.closed.not_enough} closed`, `${j.report.generated} مقترح جديد، ${j.report.closed.moved + j.report.closed.stable + j.report.closed.not_enough} أُغلق`)); await reload() } catch (e) { } break;
    /* players */
    case 'player': modal(''); S.view = 'players'; S.sel = d.id; S.sub = ''; render(); window.scrollTo(0, 0); break;
    case 'player-back': S.sel = null; S.sub = ''; rerender(); break;
    case 'player-new': S.view = 'players'; S.sel = '__new'; render(); break;
    case 'psub': S.sub = d.v; rerender(); break;
    case 'pfilter': S.filter = d.v; rerender(); break;
    case 'consent-list': consentListModal(); break;
    case 'consent-open': consentModal(d.pid); break;
    case 'copy': { const e = document.getElementById(d.src); copyText(e.value !== undefined && e.tagName === 'TEXTAREA' ? e.value : e.textContent); break }
    case 'copy-field': { const f = el.closest('form'); copyText(f.elements[d.name].value); break }
    case 'del': { if (el.dataset.sure !== '1') { el.dataset.sure = '1'; el.textContent = L('Tap again to delete', 'اضغط مرة أخرى للحذف'); setTimeout(() => { if (el.isConnected) { el.dataset.sure = ''; el.textContent = w('del') } }, 4000); break } await remove(d.kind, d.id); modal(''); if (d.kind === 'players' || d.kind === 'sessions') S.sel = null; rerender(); break }
    /* development and reports */
    case 'dsub': case 'qsub': case 'rsub': case 'msub': S.sub = d.v; rerender(); break;
    case 'ac-month': S.acMonth = d.v; rerender(); break;
    case 'rep-make': try { const j = await act('report', { op: 'make', type: d.v }, true); toast('✓ ' + L(`${j.made} draft(s) made`, `أُنشئت ${j.made} مسودة`)); await reload() } catch (e) { } break;
    case 'rep-make-one': try { await act('report', { op: 'make', type: d.v, player_ids: [d.pid] }, true); await reload() } catch (e) { } break;
    case 'rep-open': { const r = (D().reports || []).find(x => x.id === d.id); if (r) modal(reportHtml(r) + `<div class="row noprint">${r.status !== 'issued' && isAdminish() ? `<button class="btn" data-act="rep-status" data-id="${r.id}" data-v="issued">${L('Approve and issue', 'وافق وأصدر')}</button>` : ''}<button class="btn ghost" data-act="print">${L('Print or save as PDF', 'اطبع أو احفظ PDF')}</button><button class="btn ghost" data-act="modal-close">${w('close')}</button></div>`); break }
    case 'rep-status': try { const j = await act('report', { op: 'status', id: d.id, status: d.v }); upsertLocal('reports', j.rec); modal(''); rerender() } catch (e) { } break;
    case 'rep-nudge': { const r = (D().reports || []).find(x => x.id === d.id); const p = P(r.player_id); S.cmp = null; composeModal({ tpl: 'report_ready', pid: p.id }); break }
    case 'report-view': reportModal(d.id); break;
    /* money */
    case 'fees-make': try { const j = await act('fees', { month: d.v }, true); (j.recs || []).forEach(r => upsertLocal('payments', r)); toast('✓ ' + (j.recs || []).length); rerender() } catch (e) { } break;
    case 'pay-open': payModal(d.id); break;
    case 'pay-waive': { const x = (D().payments || []).find(r => r.id === d.id); await save('payments', Object.assign({}, x, { status: 'waived' })); modal(''); rerender(); break }
    /* family */
    case 'pk': S.pk = d.v; rerender(); break;
    case 'kid-open': S.kid = d.v; render(); window.scrollTo(0, 0); break;
    case 'kid-close': S.kid = null; render(); break;
    case 'ctx-open': ctxModal(d.pid, d.date); break;
    case 'hold-open': holdModal(d.pid); break;
    case 'famfb-open': famfbModal(d.pid); break;
    case 'share': try { const j = await act('share', { note_id: d.id, decision: d.v }); upsertLocal('notes', Object.assign({}, (D().notes || []).find(n => n.id === d.id), { child_share: j.rec.child_share })); rerender() } catch (e) { } break;
    /* messages */
    case 'compose': S.cmp = null; composeModal({ tpl: d.tpl || 'general', pid: d.pid, lead: d.lead }); break;
    case 'cmp-copy': copyText(fillTpl(S.cmp.tpl, { children: [L('your child', 'طفلكم')] }, S.cmp.lang, S.cmp.base).replace(/\{\w+\}/g, '')); break;
    case 'log-wa': { const m = { template: d.tpl, text: d.text || '', player_id: d.pid || '', lead_id: d.lead || '' }; const p = d.pid && P(d.pid); const l = d.lead && leads().find(x => x.id === d.lead); m.to = p ? (p.parent_name || p.name) : l ? (l.parent_name || l.child_name) : ''; m.phone = p ? p.parent_phone : l ? l.phone : ''; logMsg(m); if (d.i !== undefined) { S.sentNow = S.sentNow || {}; S.sentNow[d.i + S.cmp.tpl + S.cmp.aud] = 1; setTimeout(() => composeModal(), 400) } break }
    /* growth */
    case 'gsub': S.sub = d.v; S.month = ''; rerender(); break;
    case 'lead': leadModal(d.id); break;
    case 'lead-new': leadModal(null); break;
    case 'lead-book': bookModal(d.id); break;
    case 'lead-book-date': { const l = withStage(leads().find(x => x.id === d.id), 'booked'); l.trial_date = d.date; l.next_date = addDays(d.date, -1); l.next_note = L('Confirm the day before', 'أكّد قبلها بيوم'); await save('leads', l, true); rerender(); S.cmp = null; composeModal({ tpl: 'trial_confirm', lead: l.id }); break }
    case 'lead-stage': { let l = withStage(leads().find(x => x.id === d.id), d.v); if (d.v === 'tried') { l.next_date = addDays(todayStr(), 2); l.next_note = L('Ask about registering', 'اسأل عن التسجيل') } if (d.v === 'lost') l.next_date = ''; await save('leads', l, true); rerender(); leadModal(l.id); break }
    case 'lead-register': await registerLead(d.id); rerender(); break;
    case 'camp': campModal(d.id); break;
    case 'camp-new': campModal(null, d.m); break;
    case 'post': postModal(d.id); break;
    case 'post-new': postModal(null); break;
    case 'post-idea': postModal(null, Object.assign({ status: 'draft' }, contentIdeas()[+d.i])); break;
    case 'comp': compModal(d.id); break;
    case 'comp-new': compModal(null); break;
    /* settings */
    case 'setsub': S.sub = d.v; S.draft = null; rerender(); break;
    case 'settings-save': { const dr = draftSettings(); document.querySelectorAll('[data-tpl-en]').forEach(t => { const k = t.dataset.tplEn; const ar = document.querySelector(`[data-tpl-ar="${k}"]`); dr.templates = dr.templates || {}; const en0 = TPL[k][2], ar0 = TPL[k][3]; if (t.value !== en0 || ar.value !== ar0) dr.templates[k] = [t.value, ar.value]; else delete dr.templates[k] }); await saveSettings(dr); S.draft = null; rerender(); break }
    case 'slot-add': { const dr = draftSettings(); dr.seasons[+d.i].slots = dr.seasons[+d.i].slots || []; dr.seasons[+d.i].slots.push({ day: 4, start: '18:00', end: '20:00' }); rerender(); break }
    case 'slot-del': { const dr = draftSettings(); dr.seasons[+d.i].slots.splice(+d.j, 1); rerender(); break }
    case 'season-add': { const dr = draftSettings(); const last = (dr.seasons || []).slice(-1)[0]; const from = last ? addDays(last.to, 1) : todayStr(); dr.seasons = (dr.seasons || []).concat([{ id: newId('season'), name: 'Season', name_ar: 'موسم', from, to: addDays(from, 180), slots: [] }]); rerender(); break }
    case 'season-del': { const dr = draftSettings(); dr.seasons.splice(+d.i, 1); rerender(); break }
    case 'closed-add': { const dt = $('#cDate').value; if (!dt) { $('#cDate').focus(); break } const dr = draftSettings(); dr.closed = (dr.closed || []).concat([{ date: dt, reason: $('#cReason').value }]).sort((x, y) => x.date.localeCompare(y.date)); rerender(); break }
    case 'closed-del': { const dr = draftSettings(); dr.closed.splice(+d.i, 1); rerender(); break }
    case 'user': userModal(d.id); break;
    case 'user-new': userModal(null); break;
    case 'group': groupModal(d.id); break;
    case 'group-new': groupModal(null); break;
    case 'export': exportData(); break;
    case 'import-go': runImport(); break;
  }
});
document.addEventListener('change', async ev => {
  const el = ev.target; const d = el.dataset || {};
  if (el.id === 'impFile' && el.files[0]) { const f = el.files[0]; el.value = ''; previewImport(f); return }
  if (d.set !== undefined) { setPath(draftSettings(), d.set, d.num ? (+el.value || 0) : el.value); return }
  switch (d.chg) {
    case 'nb': { const v = el.value ? +el.value : ''; el.classList.toggle('set', !!el.value); try { const j = await act('notebook', { session_id: d.sid, items: [{ player_id: d.pid, skill: d.k, level: v }] }, true); (j.recs || []).forEach(r => upsertLocal('obs', r)) } catch (e) { } break }
    case 'evsent': S.evSent = el.checked; rerender(); break;
    case 'evscrim': { const dr = S.evDraft; dr.scrim = el.checked; if (!dr.scrim) dr.cats = dr.cats.filter(c => +c < 10); rerender(); break }
    case 'evnote': { const o = (D().obs || []).filter(x => x.session_id === d.sid && x.player_id === d.pid && x.rater === S.me.id && x.source === 'evaluator').sort((a, b) => String(a.at).localeCompare(String(b.at))).pop(); if (!o) { toast(L('Tap a level first, then add the note.', 'اختر مستوى أولًا ثم أضف الملاحظة.')); break } queueEv(d.sid, d.pid, o.skill, o.state === 'observed' ? +o.level : 'NO', el.value); break }
    case 'tpl': await coachSes(d.sid, { template: el.value }); rerender(); break;
    case 'plan-note': await coachSes(d.sid, { plan_note: el.value }); break;
    case 'money-month': S.month = el.value; rerender(); break;
    case 'month': S.month = el.value; rerender(); break;
    case 'cmp-tpl': S.cmp.tpl = el.value; S.cmp.base = tplText(el.value, S.cmp.lang); composeModal(); break;
    case 'cmp-aud': S.cmp.aud = el.value; composeModal(); break;
    case 'cmp-lang': S.cmp.lang = el.value; S.cmp.base = tplText(S.cmp.tpl, el.value); composeModal(); break;
    case 'cmp-base': S.cmp.base = el.value; composeModal(); break;
  }
});
document.addEventListener('input', ev => {
  const el = ev.target; if (el.dataset && el.dataset.input === 'q') { S.q = el.value; const pos = el.selectionStart; rerender(); const n = $('#pq'); if (n) { n.focus(); try { n.setSelectionRange(pos, pos) } catch (e) { } } }
});
document.addEventListener('submit', async ev => {
  const f = ev.target; ev.preventDefault(); const o = formObj(f); const id = f.dataset.id;
  try {
    if (f.id === 'loginForm') return doLogin(ev);
    if (f.id === 'regForm') return submitReg(f);
    if (f.id === 'pastForm') { modal(''); S.evStep = ''; await openSessionFor(o.date, o.start, { end: o.end, coach: o.coach, source: o.source || 'notebook', status: 'done' }); if (o.source === 'notebook') { S.sub = 'att'; rerender() } return }
    if (f.id === 'pform') { const old = id ? P(id) : {}; const rec = Object.assign({}, old, o, { id: id || newId('p') }); if (rec.status === 'left' && !rec.left_date) rec.left_date = todayStr(); if (rec.status !== 'left') rec.left_date = ''; await save('players', rec); S.sel = rec.id; S.sub = id ? 'family' : 'family'; rerender(); return }
    if (f.id === 'snotes') { const s = Object.assign({}, sesById(id), o); if (isAdminish()) await save('sessions', s); else await coachSes(id, { notes: o.notes }); rerender(); return }
    if (f.id === 'noteForm') { const rec = { id: newId('nt'), player_id: f.dataset.pid, text: o.text, parent_visible: o.parent_visible ? 'yes' : 'no', type: 'note', by: S.me.name, by_role: role(), at: new Date().toISOString() }; await save('notes', rec); rerender(); return }
    if (f.id === 'noticeForm') { const rec = { id: newId('nt'), session_id: f.dataset.sid, player_id: o.player_id, pillar: o.pillar, text: o.text, type: 'noticed', parent_visible: 'yes', child_share: o.child_share ? 'pending' : '', by: S.me.name, by_role: role(), at: new Date().toISOString() }; await save('notes', rec); rerender(); return }
    if (f.id === 'holdForm') { const rec = { id: newId('ho'), player_id: f.dataset.pid, kind: o.kind, from: o.from, to: o.to || o.from, note: o.note, by: S.me.name }; await save('holds', rec); rerender(); return }
    if (f.id === 'consentForm') { const rec = { consent_dev: !!o.consent_dev, consent_app: !!o.consent_app, consent_public: !!o.consent_public, consent_learning: !!o.consent_learning, consent_how: o.consent_how }; const j = await act('consent', { player_id: f.dataset.pid, rec }); upsertLocal('players', Object.assign({}, P(f.dataset.pid), j.rec)); modal(''); rerender(); return }
    if (f.id === 'ctxForm') { const rec = { player_id: f.dataset.pid, date: f.dataset.date, sleep: o.sleep || '', mood: o.mood || '', exam: o.exam ? 'yes' : '', pain: o.pain ? 'yes' : '', note: o.note || '' }; const j = await act('family', { kind: 'context', rec }); upsertLocal('context', j.rec); modal(''); rerender(); return }
    if (f.id === 'pHoldForm') { const j = await act('family', { kind: 'holds', rec: { player_id: f.dataset.pid, kind: o.kind, from: o.from, to: o.to || o.from, note: o.note } }); upsertLocal('holds', j.rec); modal(''); rerender(); return }
    if (f.id === 'famfbForm') { const rec = { player_id: f.dataset.pid, month: monthKey(todayStr()), enjoy: +o.enjoy, clarity: +o.clarity, comms: +o.comms, organisation: +o.organisation, value: +o.value, comment: o.comment || '' }; const j = await act('family', { kind: 'famfb', rec }); upsertLocal('famfb', j.rec); modal(''); rerender(); return }
    if (f.id === 'voiceForm') { await act('family', { kind: 'voice', rec: { player_id: f.dataset.pid, session_id: f.dataset.sid, fun: +o.fun, learned: +o.learned, help: !!o.help } }, true); store.set('voice-' + f.dataset.sid + '-' + f.dataset.pid, '1'); render(); return }
    if (f.id === 'payForm') { const x = (D().payments || []).find(r => r.id === id); await save('payments', Object.assign({}, x, { amount: +o.amount || x.amount, paid_at: o.paid_at, method: o.method, ref: o.ref, status: 'paid' })); modal(''); rerender(); return }
    if (f.id === 'expForm') { await save('expenses', { id: newId('ex'), date: o.date, category: o.category, amount: +o.amount || 0, note: o.note }); rerender(); return }
    if (f.id === 'bridgeForm') { const dr = draftSettings(); dr.legacy_level = {}; [1, 2, 3, 4, 5].forEach(k => dr.legacy_level[k] = +o['m' + k]); await saveSettings(dr); S.draft = null; await reload(); return }
    if (f.id === 'groupForm') { const rec = Object.assign({}, id ? groups().find(x => x.id === id) : {}, o, { id: id || newId('g'), active: 'yes' }); await save('groups', rec); modal(''); rerender(); return }
    if (f.id === 'leadForm') { const old = id ? leads().find(x => x.id === id) : null; let rec = Object.assign({}, old || { created: new Date().toISOString(), history: [] }, o); if (!old) rec.history = [{ at: rec.created, stage: rec.stage, by: S.me.name }]; else if (old.stage !== o.stage) { rec.stage = old.stage; rec = withStage(rec, o.stage) } if (!rec.id) rec.id = newId('l'); await save('leads', rec); modal(''); rerender(); return }
    if (f.id === 'campForm') { const rec = Object.assign({}, id ? (D().campaigns || []).find(x => x.id === id) : {}, o, { spend: +o.spend || 0 }); if (!rec.id) rec.id = newId('c'); await save('campaigns', rec); modal(''); S.month = rec.month; rerender(); return }
    if (f.id === 'postForm') { const rec = Object.assign({}, id ? (D().posts || []).find(x => x.id === id) : {}, o); rec.players = [].concat(o.players || []); if (!rec.id) rec.id = newId('m'); await save('posts', rec); modal(''); rerender(); return }
    if (f.id === 'compForm') { const rec = Object.assign({}, id ? (D().competitors || []).find(x => x.id === id) : {}, o); if (!rec.id) rec.id = newId('x'); await save('competitors', rec); modal(''); rerender(); return }
    if (f.id === 'userForm') { const rec = Object.assign({}, id ? (D().users || []).find(x => x.id === id) : {}, o); rec.own_kids = [].concat(o.own_kids || []); if (!rec.id) rec.id = newId('u'); await save('users', rec); modal(''); await load(); rerender(); return }
  } catch (e) { /* the reason was already shown */ }
});
window.addEventListener('hashchange', render);

/* the new-player form opens as its own screen */
const _playersScreen = playersScreen;
playersScreen = function () { if (S.sel === '__new') return `<button class="link" data-act="player-back">← ${w('players')}</button><div class="card"><h1>${L('New player', 'لاعب جديد')}</h1>${playerForm({ status: 'active', join_date: todayStr(), fee_plan: 'founding', group_id: mainGroup(), parent_pin: String(Math.floor(1000 + Math.random() * 9000)) })}</div>`; return _playersScreen() };

/* ================= start ================= */
(async function start() {
  if (location.hash === '#register') { render(); return }
  if (S.t) { $('#app').innerHTML = `<div class="login"><img src="${LOGO}" alt="HOST"><p class="muted">${L('Loading…', 'جارٍ التحميل…')}</p></div>`; try { await load(); } catch (e) { S.me = null; S.D = null; if (!/log in/i.test(e.message)) toast('⚠ ' + e.message) } }
  render();
})();

</script>
